name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  REDOCLY_TELEMETRY: "off"
  REDOCLY_SUPPRESS_UPDATE_NOTICE: "true"

jobs:
  commit-messages:
    name: Commit messages
    uses: akai-ito/.github/.github/workflows/commit-messages.yml@main

  docs:
    name: Docs
    uses: akai-ito/.github/.github/workflows/docs.yml@main

  workflows:
    name: Workflows and scripts
    uses: akai-ito/.github/.github/workflows/workflows.yml@main

  spec:
    name: Spec is valid OpenAPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/node
      - name: Lint protocol/openapi.yaml
        run: npm run check:spec

  transcripts:
    name: Transcripts match the spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/node
      - name: Check every golden transcript
        run: npm run check:transcripts

  generated:
    name: Generated files are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/node
      - name: Generate the transcripts and types again
        run: npm run generate
      - name: Compare with the committed files
        run: |
          if ! git diff --quiet -- protocol/; then
            git diff --stat -- protocol/
            echo "::error title=Generated files are stale::Run npm run generate and commit protocol/transcripts and protocol/types.ts."
            exit 1
          fi

  replay:
    name: Transcripts replay against the server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/node
      - name: Replay every golden transcript through the real server
        run: npx vitest run test/transcripts.test.ts

  cli:
    name: The ito command behaves
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/node
      - name: Run ito's commands in-process
        run: npx vitest run test/cli.test.ts

  crash:
    name: Server survives a crash mid-reply
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/node
      - name: Kill ito serve mid-reply and restart it
        run: npx vitest run test/crash.test.ts

  codex-engine:
    name: Codex adapter works with the pinned Codex
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/node
      - name: Drive codex app-server against a mock model
        run: npx vitest run test/codex-engine.test.ts

  codex-bindings:
    name: Codex bindings are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/node
      - name: Generate the bindings from the pinned Codex again
        run: npm run generate:codex
      - name: Compare with the committed bindings
        run: |
          if [ -n "$(git status --porcelain -- src/engine/codex/bindings)" ]; then
            git status --short -- src/engine/codex/bindings | head -20
            echo "::error title=Codex bindings are stale::Run npm run generate:codex and commit src/engine/codex/bindings."
            exit 1
          fi

  types:
    name: TypeScript compiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/node
      - name: Type-check
        run: npm run typecheck

  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/node
      - name: Lint
        run: npm run lint

  format:
    name: Prettier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/node
      - name: Check formatting
        run: npm run format:check

  api-docs:
    name: API docs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/node
      - name: Build the site
        run: npm run docs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: api-docs
          path: site/
          retention-days: 7
