openapi: 3.1.0
info:
  title: Ito client API
  version: "0.11"
  summary: Commands in, one resumable event stream out.
  description: |
    The API that Ari, and any other client, uses to talk to an Ito server.

    - **Discover** which protocol versions a server speaks with `GET /.well-known/ito`, before
      you have a token.
    - **Authenticate** every other request with `Authorization: Bearer <token>`. `ito serve`
      prints the token once, when it creates it.
    - **Listen** on `GET /v0/events`, one Server-Sent Events stream that carries everything the
      server says. Resume with `Last-Event-ID` after any disconnect.
    - **Send** with `POST /v0/messages`. The app chooses the message id, so retrying is always
      safe.
    - **Stop** a turn, or **try again** after one failed, with commands on the turn.
    - **Pair** a new app by exchanging the short-lived code in the QR code `ito pair` shows for a
      token of its own.
    - **Attach** photos and files: upload each one, then name them in a message.
    - **Answer** what the agent asks by sending a message, or cancel the ask.
    - **Notify** a device while you're not looking: register it, then say when the conversation is
      on screen. [The push schema](push.schema.json) describes what it receives.
    - **Set up capabilities:** list what's installed with the server, switch each one on or off,
      and fill in its setup sheet.
    - **Read memory:** what's in Ari's mind, the shelves and their pages with a line on each, the
      journal, what Ari changed lately and why, and what each change changed. Ari writes memory
      itself; the API only reads it.
    - **Choose the model** the agent runs on, and how hard it thinks, from those its engine offers.
    - **Talk:** start and end a call with the agent, and stream it: your microphone up, Ari's voice
      down, with states and captions. The server hears your turns, steered toward the names in
      memory, and posts each as a spoken message; teach it a word it got wrong.
    - **Ari's voice:** whether the server can hold a call, the voices Ari can speak in, choosing
      one, and hearing it speak.

    **Versioning.** Routes carry the protocol's major version, and every response carries an
    `Ito-Protocol` header with the full version. Until 1.0, every protocol change may break, so
    an app and a server must speak the same `0.MINOR`. Apps ignore fields and event types they
    don't recognise; servers ignore unknown request fields.

    **Retries.** Every command is idempotent: sending a message again with the same id, repeating
    a stop, or repeating a try again has the effect of doing it once. Retry network errors,
    `429` and `5xx` responses with backoff, honouring `Retry-After`.

    **Errors.** A refused command answers with an HTTP status and an `error` object: a stable
    `code`, a plain `message` for the person using the app, and a technical `detail`.
  license:
    name: PolyForm Noncommercial 1.0.0 or PolyForm Small Business 1.0.0
    identifier: PolyForm-Noncommercial-1.0.0 OR PolyForm-Small-Business-1.0.0
servers:
  - url: https://{host}
    description: Your Ito server, reached over HTTPS (for example through Tailscale).
    variables:
      host:
        default: studio.example.ts.net
security:
  - token: []
tags:
  - name: Connecting
    description: Find out what a server speaks and who it is.
  - name: Conversation
    description: Send messages, follow the conversation and read its history.
  - name: Attachments
    description: Upload the photos and files you attach to messages, and fetch them again.
  - name: Turns
    description: Control the agent's work on a turn.
  - name: Asks
    description: Settle what the agent asked you.
  - name: Notifications
    description: Reach you through push notifications while you're not looking.
  - name: Capabilities
    description: Switch capabilities on and off, and set them up.
  - name: Memory
    description: Read what Ari remembers. Ari writes it; apps only read.
  - name: Model
    description: Choose the model the agent runs on.
  - name: Talk
    description: Call the agent, speak your messages, and steer speech recognition with your words.
paths:
  /.well-known/ito:
    get:
      tags: [Connecting]
      operationId: discover
      summary: Discover the protocol versions
      description: |
        Open to anyone, and unversioned, so it works across majors. An app compares these
        versions with its own before sending the token, and says which side to update when they
        don't match.
      security: []
      responses:
        "200":
          description: The versions this server speaks.
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Discovery" }
              example:
                product: ito
                protocol: ["0.9"]
        "429": { $ref: "#/components/responses/SlowDown" }
  /v0/pair:
    post:
      tags: [Connecting]
      operationId: pair
      summary: Exchange a pairing code for a token
      description: |
        The code comes from the QR code `ito pair` shows on the server, which holds
        `ito://pair?address=…&code=…`. A code works once, for five minutes. The answer is a token
        for this device alone: keep it like the token `ito serve` printed, since the server keeps only
        its hash, and `ito token new` still replaces every token at once. A wrong, used or expired
        code is refused, and repeated wrong codes are slowed down like wrong tokens.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Pair" }
            example: { code: 7F3K-92QD, device_name: Sam's iPhone }
      responses:
        "201":
          description: Paired; this is the device's token.
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PairResult" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/PairingCodeRejected" }
        "429": { $ref: "#/components/responses/SlowDown" }
  /v0/server:
    get:
      tags: [Connecting]
      operationId: getServer
      summary: Check the token and meet the server
      description: The first authenticated call when connecting; it names the server and the agent.
      responses:
        "200":
          description: The token is accepted.
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServerInfo" }
              example:
                name: studio
                version: 0.9.0
                protocol: "0.9"
                agent:
                  name: Ari
                  model: gpt-6.1-sol
                  effort: low
                  account: { kind: chatgpt, plan: plus, email_domain: example.com }
                setup: { notifications: true, memory_backup: true }
                capabilities: [{ id: reports, version: "0.1" }]
        "401": { $ref: "#/components/responses/TokenRejected" }
        "429": { $ref: "#/components/responses/SlowDown" }
  /v0/events:
    get:
      tags: [Conversation]
      operationId: streamEvents
      summary: Follow the conversation
      description: |
        One long-lived `text/event-stream` response that carries every event, in order. Each
        Server-Sent Event has an `id:` line (the event's id) and a `data:` line (the event as JSON,
        described by [the events schema](events.schema.json)). A comment line, `: ping`, arrives at
        least every 15 seconds; treat 45 seconds of silence as a dead connection and reconnect.

        Send the id of the last event you applied as `Last-Event-ID` to resume: you receive every
        later event exactly once. When the server can't resume from it (there was none, it doesn't
        know it, or you are too far behind), the stream starts with a `snapshot` instead; replace
        your view of the conversation with it.

        A turn runs to its end whether or not anyone is connected.
      parameters:
        - name: Last-Event-ID
          in: header
          required: false
          description: The id of the last event you applied.
          schema: { $ref: "events.schema.json#/$defs/EventId" }
      responses:
        "200":
          description: The event stream.
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
          content:
            text/event-stream:
              schema:
                type: string
                description: Server-Sent Events, each carrying one event from the events schema.
              example: |
                id: e_0042
                data: {"id":"e_0042","type":"turn.status","at":"2026-10-12T09:41:01.200Z","turn":"t_0007","kind":"working","label":"Searching the web for riverside cafés"}

                : ping
        "401": { $ref: "#/components/responses/TokenRejected" }
        "429": { $ref: "#/components/responses/SlowDown" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v0/messages:
    post:
      tags: [Conversation]
      operationId: sendMessage
      summary: Send a message
      description: |
        Answers as soon as the message is on the server's disk, without waiting for the agent.
        What happens next arrives on the event stream: `turn.started` when it starts a turn,
        `message.read` when the agent takes it into the running turn, or `message.queued` when it
        waits as Next. Send waiting messages one at a time, in order, each answered before the
        next.

        Sending the same id again returns the same message and changes nothing.

        To attach photos or files, upload each one first with `PUT /v0/attachments/{attachment}`,
        then name them in `attachments`; the text may then be empty. An attachment belongs to one
        message. If one isn't on the server, because no message named it for a day, the message is
        refused with `attachment_missing`: upload its attachments again under the same ids, then
        send the same message again.

        While an ask waits, the message answers it, whether or not it names the ask: `message.accepted`
        for the message comes first, then `ask.ended`. Name the ask in `answers` when you send a
        tapped option or a secret. The text of an answer to a secret ask is never stored, never
        streamed and never sent back: the message keeps an empty text, marked `secret`, and only the
        agent's next turn receives what you typed. A secret answer can't carry attachments.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SendMessage" }
            example:
              id: 5b6c0a3e-8d1f-4c2a-9e7b-3f1d2c4b5a69
              text: Plan my Saturday, a long run in the morning, then something calm.
      responses:
        "201":
          description: Accepted for the first time.
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageResult" }
        "200":
          description: Already accepted earlier; nothing changed.
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageResult" }
        "400":
          description: >-
            The request is malformed or not possible now (`invalid_request`), or an attachment it
            names isn't on the server (`attachment_missing`).
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResult" }
              example:
                error:
                  code: attachment_missing
                  message: A photo or file in this message isn't on the server.
                  detail: Uploads no message names are deleted after a day. Upload this message's attachments again, then send it again.
        "401": { $ref: "#/components/responses/TokenRejected" }
        "409": { $ref: "#/components/responses/IdConflict" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "429": { $ref: "#/components/responses/SlowDown" }
        "503": { $ref: "#/components/responses/Unavailable" }
    get:
      tags: [Conversation]
      operationId: listMessages
      summary: Read older messages
      description: |
        The messages just before a given one, oldest first, with the agent's steps among them.
        The newest messages come from the event stream's `snapshot`, so `before` is always
        required. A `404` means the server doesn't know that message (it was restored from a
        backup): reconnect to the event stream for a snapshot.
      parameters:
        - name: before
          in: query
          required: true
          description: Return messages older than this one.
          schema: { $ref: "events.schema.json#/$defs/MessageId" }
        - name: limit
          in: query
          required: false
          description: How many messages to return.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: A page of older messages.
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessagePage" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/TokenRejected" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/SlowDown" }
  /v0/turns/{turn}/stop:
    post:
      tags: [Turns]
      operationId: stopTurn
      summary: Stop a turn
      description: |
        Handled ahead of everything else, and never behind a message being accepted. The server
        sends no more text for the turn, stops the agent, and keeps the message being written cut
        at `cut`: where it was on your screen. `turn.ended` with outcome `stopped` follows once the
        agent has really stopped.

        If the turn has already ended, nothing changes and the answer gives its outcome.
        Messages waiting as Next are answered after the stop.
      parameters:
        - $ref: "#/components/parameters/Turn"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StopTurn" }
            example:
              cut: { message: m_0012, offset: 214 }
      responses:
        "202":
          description: The turn is stopping.
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StopResult" }
              example: { turn: t_0007, state: stopping }
        "200":
          description: The turn had already ended.
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StopResult" }
              example: { turn: t_0007, state: ended, outcome: completed }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/TokenRejected" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v0/turns/{turn}/retry:
    post:
      tags: [Turns]
      operationId: retryTurn
      summary: Try a failed turn again
      description: |
        Starts a new turn that answers the same messages, below the failed reply, which stays.
        The failed turn's id is the retry key: repeating the request returns the same new turn.
        Only a failed turn can be tried again.
      parameters:
        - $ref: "#/components/parameters/Turn"
      responses:
        "202":
          description: A new attempt has started.
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RetryResult" }
              example: { turn: t_0008, retry_of: t_0007 }
        "200":
          description: Already tried again; this is that attempt.
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RetryResult" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/TokenRejected" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v0/attachments/{attachment}:
    put:
      tags: [Attachments]
      operationId: uploadAttachment
      summary: Upload a photo or file
      description: |
        The body is the file's bytes, with its `Content-Type`. The app makes the attachment's id
        before uploading, so retrying is always safe: the same bytes again change nothing, and
        different bytes under the same id are an `id_conflict`. Upload before sending the message
        that names it. Scale photos down first (about 2048 pixels on the long edge, as JPEG): that is
        roughly what the model looks at. An attachment no message names is deleted after a day.
      parameters:
        - $ref: "#/components/parameters/Upload"
        - name: name
          in: query
          required: true
          description: The file's name, shown with the message and used in the agent's workspace.
          schema:
            type: string
            minLength: 1
            maxLength: 255
      requestBody:
        required: true
        content:
          "*/*":
            schema:
              description: The file's bytes, at most 20 MB (20 × 1024 × 1024 bytes).
      responses:
        "201":
          description: Uploaded.
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AttachmentResult" }
        "200":
          description: Already uploaded with these bytes; nothing changed.
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AttachmentResult" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/TokenRejected" }
        "409": { $ref: "#/components/responses/IdConflict" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "429": { $ref: "#/components/responses/SlowDown" }
    get:
      tags: [Attachments]
      operationId: getAttachment
      summary: Fetch an attachment's bytes
      description: The bytes, with the media type they were uploaded with. They never change, so keep them once fetched.
      parameters:
        - $ref: "#/components/parameters/Attachment"
      responses:
        "200":
          description: The file.
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
          content:
            "*/*":
              schema:
                description: The file's bytes.
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/TokenRejected" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/SlowDown" }
  /v0/asks/{ask}/cancel:
    post:
      tags: [Asks]
      operationId: cancelAsk
      summary: Cancel an ask
      description: |
        What Stop does while an ask waits. The ask ends as `cancelled`, nothing is sent to the agent,
        and it learns at the start of its next turn that you didn't answer. Cancelling an ask that
        has already ended changes nothing, and the answer gives the ask as it ended.
      parameters:
        - $ref: "#/components/parameters/Ask"
      responses:
        "200":
          description: The ask, as it ended.
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AskResult" }
        "401": { $ref: "#/components/responses/TokenRejected" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v0/devices/{device}:
    put:
      tags: [Notifications]
      operationId: registerDevice
      summary: Register a device for notifications
      description: |
        Call it when the system gives the app a push token, and again whenever the token changes or
        you rotate the key (every 30 days, say). The server keeps one registration per device and
        always encrypts with its latest key. Keep the previous key on the device for a while: a
        notification already on its way names the key that encrypted it.

        The server pushes only while you're not looking: when a reply finishes, when a turn fails,
        when the agent asks you something, and once more for an ask still waiting after three hours.
      parameters:
        - $ref: "#/components/parameters/Device"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterDevice" }
            example:
              apns_token: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
              environment: production
              notification_key: MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
      responses:
        "201":
          description: Registered for the first time.
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceResult" }
        "200":
          description: Registered again; the new token and key replace the old ones.
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceResult" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/TokenRejected" }
    delete:
      tags: [Notifications]
      operationId: removeDevice
      summary: Stop notifying a device
      description: Forgets the device, its token and its key. Removing a device the server doesn't know changes nothing.
      parameters:
        - $ref: "#/components/parameters/Device"
      responses:
        "204":
          description: The device is no longer registered.
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
        "401": { $ref: "#/components/responses/TokenRejected" }
  /v0/devices/{device}/presence:
    put:
      tags: [Notifications]
      operationId: setPresence
      summary: Say whether you're looking
      description: |
        Send `looking: true` when the conversation comes on screen, and `false` when it leaves the
        screen or the app goes to the background. Nothing is pushed while any device is looking and
        holds a live event stream, so a device that crashed or lost its connection is still
        notified. The server forgets presence when it restarts: send it again after reconnecting.
      parameters:
        - $ref: "#/components/parameters/Device"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Presence" }
            example: { looking: true }
      responses:
        "204":
          description: Noted.
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/TokenRejected" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v0/capabilities:
    get:
      tags: [Capabilities]
      operationId: listCapabilities
      summary: List the capabilities
      description: |
        Every capability installed with the server, whether it's on or not, with what Settings needs
        to show it and its setup sheet. Fetch it when Settings opens and after a change; nothing on
        the event stream says a capability changed.
      responses:
        "200":
          description: The capabilities, in the order to show them.
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CapabilityList" }
        "401": { $ref: "#/components/responses/TokenRejected" }
  /v0/capabilities/{capability}:
    put:
      tags: [Capabilities]
      operationId: switchCapability
      summary: Switch a capability on or off
      description: |
        Switching off takes effect at once: the agent can no longer use it. Its setup values stay until
        it's set up again. Switching on a capability whose setup isn't complete leaves it in `setup`.
      parameters:
        - $ref: "#/components/parameters/Capability"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SwitchCapability" }
            example: { on: true }
      responses:
        "200":
          description: The capability, as the list now shows it.
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Capability" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/TokenRejected" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v0/capabilities/{capability}/setup:
    put:
      tags: [Capabilities]
      operationId: setUpCapability
      summary: Save a capability's setup
      description: |
        The values merge into what's saved: leave out a secret to keep it, or send `""` to clear a
        field. A secret is never sent back to any app. A capability that's on restarts with the new
        values, and the answer says whether it took them.
      parameters:
        - $ref: "#/components/parameters/Capability"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CapabilitySetup" }
            example: { values: { token: github_pat_example } }
      responses:
        "200":
          description: The capability, as the list now shows it.
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Capability" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/TokenRejected" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v0/capabilities/{capability}/check:
    post:
      tags: [Capabilities]
      operationId: checkCapability
      summary: Test setup values
      description: |
        *Test connection*: the capability tries the values, merged into what's saved, without saving
        them. The answer is empty when they work, or says what's wrong.
      parameters:
        - $ref: "#/components/parameters/Capability"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CapabilitySetup" }
            example: { values: { token: github_pat_example } }
      responses:
        "200":
          description: Whether the values work.
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckResult" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/TokenRejected" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v0/memory/in-mind:
    get:
      tags: [Memory]
      operationId: getInMind
      summary: What's in Ari's mind
      description: The pages that go into every turn, in order (Portrait, Now, How to help you). A page Ari hasn't written yet is left out.
      responses:
        "200":
          description: The pages, as they are now.
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemoryPages" }
        "401": { $ref: "#/components/responses/TokenRejected" }
  /v0/memory/shelves:
    get:
      tags: [Memory]
      operationId: listShelves
      summary: The shelves, with how much is on each
      responses:
        "200":
          description: Every shelf, in order, the journal last.
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShelfList" }
        "401": { $ref: "#/components/responses/TokenRejected" }
  /v0/memory/pages:
    get:
      tags: [Memory]
      operationId: listPages
      summary: The pages on a shelf
      description: Pages by title; journal days newest first.
      parameters:
        - name: shelf
          in: query
          required: true
          schema: { $ref: "#/components/schemas/Shelf" }
      responses:
        "200":
          description: The shelf's pages.
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PageList" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/TokenRejected" }
  /v0/memory/recent:
    get:
      tags: [Memory]
      operationId: listRecentChanges
      summary: What Ari changed in memory lately
      description: |
        The 20 newest changes, newest first, one row per change, each with Ari's note on what it
        changed. A page changed twice has two rows. `getChange` opens any of them.
      responses:
        "200":
          description: The changes.
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecentChanges" }
        "401": { $ref: "#/components/responses/TokenRejected" }
  /v0/memory/page:
    get:
      tags: [Memory]
      operationId: getPage
      summary: One page, or one journal day
      description: |
        The page's Markdown, without its front matter: the present first, then any *Earlier*
        section, as Ari wrote it. Render it as Markdown.
      parameters:
        - name: address
          in: query
          required: true
          schema: { $ref: "events.schema.json#/$defs/MemoryAddress" }
      responses:
        "200":
          description: The page.
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemoryPage" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/TokenRejected" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v0/memory/changes/{change}:
    get:
      tags: [Memory]
      operationId: getChange
      summary: What a change to memory changed
      description: The page's Markdown before and after one `updated` step. `before` is absent for a new page, and `after` for a page Ari deleted.
      parameters:
        - name: change
          in: path
          required: true
          schema: { $ref: "events.schema.json#/$defs/ChangeId" }
      responses:
        "200":
          description: The change.
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemoryChange" }
        "401": { $ref: "#/components/responses/TokenRejected" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v0/models:
    get:
      tags: [Model]
      operationId: listModels
      summary: The models the agent can run on
      description: |
        Every model the agent's engine offers, with how hard each can think, and the current choice.
        Until one is chosen, `chosen` is the engine's default model at its default effort. A chosen
        model the engine no longer offers stays chosen, but is missing from `models`.
      responses:
        "200":
          description: The models and the choice.
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelList" }
        "401": { $ref: "#/components/responses/TokenRejected" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v0/agent:
    put:
      tags: [Model]
      operationId: chooseModel
      summary: Choose the agent's model
      description: |
        One choice for the whole server, kept across restarts. It applies from the next message;
        a turn already running finishes on the model it started with.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ModelChoice" }
            example: { model: gpt-6-luna, effort: medium }
      responses:
        "200":
          description: The choice, as saved.
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelChoice" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/TokenRejected" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v0/calls/{call}:
    put:
      tags: [Talk]
      operationId: startCall
      summary: Start a call
      description: |
        Starts a call under the id the app chose, so starting it again is safe. While it's on, the
        agent speaks: short replies, no lists, the details in the chat, and notes as spoken lines.
        Starting a call while another is on ends the earlier one first.
      parameters:
        - $ref: "#/components/parameters/Call"
      responses:
        "201":
          description: The call started.
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CallResult" }
        "200":
          description: It had already started; nothing changed.
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CallResult" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/TokenRejected" }
  /v0/calls/{call}/end:
    post:
      tags: [Talk]
      operationId: endCall
      summary: End a call
      description: Ends the call, with its length. Ending one that has already ended changes nothing.
      parameters:
        - $ref: "#/components/parameters/Call"
      responses:
        "200":
          description: The call, as it ended.
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CallResult" }
        "401": { $ref: "#/components/responses/TokenRejected" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v0/calls/{call}/audio:
    delete:
      tags: [Talk]
      operationId: deleteCallAudio
      summary: Delete a call's audio
      description: Deletes the recordings of the call's spoken messages; their text stays. Deleting it again changes nothing.
      parameters:
        - $ref: "#/components/parameters/Call"
      responses:
        "200":
          description: The call, with its audio deleted.
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CallResult" }
        "401": { $ref: "#/components/responses/TokenRejected" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v0/calls/{call}/stream:
    get:
      tags: [Talk]
      operationId: streamCall
      summary: Stream a call
      description: |
        Upgrades to a WebSocket once the call is on (`PUT /v0/calls/{call}`), with the token in
        `Authorization` as everywhere. One stream per call: a second connection replaces the first,
        which closes with code 4000.

        - **Binary frames up:** your microphone, 16-bit little-endian PCM, mono, 16 kHz, in frames
          of 20 to 40 ms. Send continuously while unmuted, silence included: turn-taking times it.
        - **Binary frames down:** Ari's voice, 16-bit little-endian PCM, mono, 24 kHz. Play them in
          order; each follows the `saying` frame that names its sentence.
        - **Text frames** both ways are JSON, as in
          [the stream schema](stream.schema.json): `mute`, `unmute`, `end` and `played` from the
          app; `state`, `heard`, `saying`, `stop_playback` and `problem` from the server.

        The server posts each of your turns as a spoken message itself, with its recording and the
        words it corrected, so the conversation events are as for any message. If the socket
        drops, the call stays on for 20 seconds and reconnecting carries on; past that the call
        ends with `end_reason` "The connection dropped." A `problem` frame ends the call with its
        reason, and the server closes the socket.
      parameters:
        - $ref: "#/components/parameters/Call"
      responses:
        "101":
          description: Switching to the WebSocket.
        "401": { $ref: "#/components/responses/TokenRejected" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v0/vocabulary/corrections:
    post:
      tags: [Talk]
      operationId: teachVocabulary
      summary: Teach it what you meant
      description: |
        Each pair is a word the recogniser heard and what you meant. When `meant` is a page's title
        or alias, `heard` joins that page's mishearings; otherwise the pair is kept as a term of its
        own. Teaching the same pair again changes nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Corrections" }
            example: { corrections: [{ heard: Bara, meant: Bora }] }
      responses:
        "200":
          description: Where each one went.
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Corrections" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/TokenRejected" }
  /v0/speech:
    post:
      tags: [Talk]
      operationId: speak
      summary: Say something in Ari's voice
      description: |
        Says the text in Ari's voice and answers with a WAV: 24 kHz, mono, 16-bit PCM. Settings uses it
        to preview voices, and a call uses it a sentence at a time, asking for the next while one plays,
        until the call stream carries Ari's voice. Left out, `voice` is the one chosen with
        `PUT /v0/voice`. While the voice isn't ready, the answer is `unavailable`, with `Retry-After`
        while it's loading and the reason in `detail`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SpeechRequest" }
            example: { text: "Hi, I'm Ari. This is how I sound.", voice: bf_emma }
      responses:
        "200":
          description: The speech.
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
          content:
            audio/wav:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/TokenRejected" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v0/voices:
    get:
      tags: [Talk]
      operationId: listVoices
      summary: Ari's voices, and whether the server can talk
      description: |
        Every voice, the one chosen, and the voice's state: offer Talk only while it's `ready`, and
        otherwise show the reason. `voice.status` events say when the state changes.
      responses:
        "200":
          description: The voices and the voice's state.
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VoiceList" }
        "401": { $ref: "#/components/responses/TokenRejected" }
  /v0/voice/voiceprint:
    delete:
      tags: [Talk]
      operationId: forgetVoiceprint
      summary: Relearn your voice
      description: |
        Forgets the voiceprint the server learnt from your calls, so it learns your voice again from
        the next two minutes of you speaking, starting with a call in progress.
      responses:
        "200":
          description: The voices, with `voiceprint` now `learning`.
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VoiceList" }
        "401": { $ref: "#/components/responses/TokenRejected" }
  /v0/voice:
    put:
      tags: [Talk]
      operationId: chooseVoice
      summary: Choose Ari's voice
      description: One choice for the whole server, kept across restarts. It applies from the next sentence Ari says.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VoiceChoice" }
            example: { voice: bf_emma }
      responses:
        "200":
          description: The choice, as saved.
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VoiceChoice" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/TokenRejected" }
components:
  securitySchemes:
    token:
      type: http
      scheme: bearer
      bearerFormat: ito_…
      description: |
        The token `ito serve` printed when it created it; `ito token new` replaces it. Send it only
        over HTTPS (or to a loopback address during development). The server never logs it.
  headers:
    ItoProtocol:
      description: The protocol version this response speaks, as `MAJOR.MINOR`.
      schema:
        type: string
        pattern: ^\d+\.\d+$
        example: "0.11"
    RetryAfter:
      description: Seconds to wait before trying again.
      schema:
        type: integer
        minimum: 0
  parameters:
    Turn:
      name: turn
      in: path
      required: true
      description: The turn's id, from `turn.started`.
      schema: { $ref: "events.schema.json#/$defs/TurnId" }
    Upload:
      name: attachment
      in: path
      required: true
      description: The id the app made for what it's uploading.
      schema: { $ref: "events.schema.json#/$defs/UploadId" }
    Attachment:
      name: attachment
      in: path
      required: true
      description: The attachment's id, from its message.
      schema: { $ref: "events.schema.json#/$defs/AttachmentId" }
    Ask:
      name: ask
      in: path
      required: true
      description: The ask's id, from `ask.started`.
      schema: { $ref: "events.schema.json#/$defs/AskId" }
    Device:
      name: device
      in: path
      required: true
      description: A random UUID the app makes once per install, and keeps.
      schema:
        type: string
        format: uuid
    Call:
      name: call
      in: path
      required: true
      description: The id the app chose when it started the call.
      schema: { $ref: "events.schema.json#/$defs/CallId" }
    Capability:
      name: capability
      in: path
      required: true
      description: The capability's id, such as `reports`.
      schema: { $ref: "#/components/schemas/CapabilityId" }
  responses:
    InvalidRequest:
      description: The request is malformed, or not possible in the current state (`invalid_request`).
      headers:
        Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResult" }
          example:
            error:
              code: invalid_request
              message: Only a reply that failed can be tried again.
              detail: Turn t_0007 ended with outcome completed.
    TokenRejected:
      description: The token is missing, malformed, unknown or replaced (`token_rejected`).
      headers:
        Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResult" }
          example:
            error:
              code: token_rejected
              message: The server didn't accept this token.
              detail: Use the token ito serve printed, or run ito token new.
    PairingCodeRejected:
      description: The pairing code is wrong, already used or expired (`pairing_code_rejected`).
      headers:
        Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResult" }
          example:
            error:
              code: pairing_code_rejected
              message: That pairing code has expired or was already used.
              detail: Run ito pair on the server for a new code.
    NotFound:
      description: The server doesn't know this turn, message, ask, attachment or device (`not_found`).
      headers:
        Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResult" }
    IdConflict:
      description: A message or attachment with this id was already accepted with different content (`id_conflict`).
      headers:
        Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResult" }
    TooLarge:
      description: The message or attachment is larger than the server accepts (`too_large`).
      headers:
        Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResult" }
    SlowDown:
      description: Too many requests, or too many wrong tokens (`slow_down`).
      headers:
        Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
        Retry-After: { $ref: "#/components/headers/RetryAfter" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResult" }
    Unavailable:
      description: The server is starting or shutting down (`unavailable`).
      headers:
        Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
        Retry-After: { $ref: "#/components/headers/RetryAfter" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResult" }
  schemas:
    SpeechRequest:
      type: object
      required: [text]
      properties:
        text:
          description: What to say, as it should be spoken.
          type: string
          minLength: 1
          maxLength: 500
        voice:
          description: "A voice's id from `GET /v0/voices`. Left out, the chosen voice speaks."
          type: string
    VoiceList:
      type: object
      required: [voices, chosen, state, voiceprint]
      properties:
        voices:
          type: array
          items: { $ref: "#/components/schemas/Voice" }
        chosen:
          description: The id of the voice Ari speaks in.
          type: string
        state: { $ref: "events.schema.json#/$defs/VoiceState" }
        reason: { $ref: "events.schema.json#/$defs/VoiceReason" }
        voiceprint: { $ref: "#/components/schemas/VoiceprintState" }
    VoiceprintState:
      description: |
        `learnt` once the server knows your voice from your calls, so only a voice like yours holds a
        turn open; `learning` until it has heard enough of you, about two minutes of a call.
      enum: [learning, learnt]
    VoiceChoice:
      type: object
      required: [voice]
      properties:
        voice: { description: "A voice's id from `GET /v0/voices`.", type: string, minLength: 1 }
    Voice:
      type: object
      required: [id, name, accent]
      properties:
        id: { description: "Such as `af_heart`.", type: string }
        name: { description: "Such as Heart.", type: string }
        accent: { enum: [american, british] }
    CallResult:
      type: object
      required: [call]
      properties:
        call: { $ref: "events.schema.json#/$defs/Call" }
    Corrections:
      type: object
      required: [corrections]
      properties:
        corrections:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: object
            required: [heard, meant]
            properties:
              heard: { type: string, minLength: 1, maxLength: 100 }
              meant: { type: string, minLength: 1, maxLength: 100 }
              address:
                description: In an answer, the page the mishearing joined, when there was one.
                $ref: "events.schema.json#/$defs/MemoryAddress"
    ModelChoice:
      type: object
      required: [model, effort]
      properties:
        model: { description: The model's id., type: string, minLength: 1 }
        effort: { description: "One of the model's efforts, such as `medium`.", type: string, minLength: 1 }
    ModelList:
      type: object
      required: [models, chosen]
      properties:
        models:
          type: array
          items: { $ref: "#/components/schemas/ModelOption" }
        chosen: { $ref: "#/components/schemas/ModelChoice" }
    ModelOption:
      description: A model the engine offers.
      type: object
      required: [id, title, summary, efforts, default_effort, is_default, images]
      properties:
        id: { description: What to send as `model` to choose it., type: string }
        title:
          description: Its name, such as GPT-6.1-Sol.
          type: string
        summary:
          description: One line on what it's for, in the engine's words.
          type: string
        efforts:
          description: How hard it can think, lightest first, each with the engine's own line about it.
          type: array
          items:
            type: object
            required: [id, summary]
            properties:
              id: { description: "Such as `low`, `medium`, `high` or `xhigh`.", type: string }
              summary: { type: string }
        default_effort: { description: The effort it runs at unless one is chosen., type: string }
        is_default: { description: True for the engine's default model., type: boolean }
        images: { description: Whether it can see photos you attach., type: boolean }
    Shelf:
      description: A shelf in memory; `journal` holds one page per day.
      enum: [people, goals, projects, places, topics, journal]
    Gist:
      description: |
        What the page is now, in one line, written by Ari and kept current with every change: a
        journal day's headline, who someone is to you, where a project stands. Absent until Ari
        has written one; Ari writes one for every page that lacks it, soon after the server starts.
      type: string
    MemoryPageSummary:
      type: object
      required: [address, title, changed_at]
      properties:
        address: { $ref: "events.schema.json#/$defs/MemoryAddress" }
        title: { type: string }
        gist: { $ref: "#/components/schemas/Gist" }
        changed_at: { $ref: "events.schema.json#/$defs/Timestamp" }
    MemoryLink:
      description: A page this one links to, as it is now.
      type: object
      required: [address, title, aliases]
      properties:
        address: { $ref: "events.schema.json#/$defs/MemoryAddress" }
        title: { type: string }
        aliases:
          description: Other names Ari knows it by, for finding mentions of it in the page.
          type: array
          items: { type: string }
    MemoryPage:
      type: object
      required: [address, title, shelf, aliases, links, changed_at, markdown]
      properties:
        address: { $ref: "events.schema.json#/$defs/MemoryAddress" }
        title: { type: string }
        gist: { $ref: "#/components/schemas/Gist" }
        shelf:
          description: Its shelf, or `portrait`, `now` or `helping-you` for the pages in mind.
          enum: [portrait, now, helping-you, people, goals, projects, places, topics, journal]
        aliases:
          description: Other names Ari knows it by.
          type: array
          items: { type: string }
        links:
          description: The related pages that exist, in Ari's order.
          type: array
          items: { $ref: "#/components/schemas/MemoryLink" }
        changed_at: { $ref: "events.schema.json#/$defs/Timestamp" }
        markdown:
          description: The page as Ari wrote it, without front matter.
          type: string
    MemoryPages:
      type: object
      required: [pages]
      properties:
        pages:
          type: array
          items: { $ref: "#/components/schemas/MemoryPage" }
    PageList:
      type: object
      required: [pages]
      properties:
        pages:
          type: array
          items: { $ref: "#/components/schemas/MemoryPageSummary" }
    RecentChange:
      type: object
      required: [change, address, title, at]
      properties:
        change: { $ref: "events.schema.json#/$defs/ChangeId" }
        address: { $ref: "events.schema.json#/$defs/MemoryAddress" }
        title:
          description: The page's title when it changed.
          type: string
        at: { $ref: "events.schema.json#/$defs/Timestamp" }
        note:
          description: |
            What the change did, in a few words, such as "Florence together 6–9 Nov". Absent for
            pages that came from outside with `ito memory pull`, and for changes made before 0.11.
          type: string
    RecentChanges:
      type: object
      required: [changes]
      properties:
        changes:
          type: array
          items: { $ref: "#/components/schemas/RecentChange" }
    ShelfList:
      type: object
      required: [shelves]
      properties:
        shelves:
          type: array
          items:
            type: object
            required: [shelf, count]
            properties:
              shelf: { $ref: "#/components/schemas/Shelf" }
              count: { type: integer, minimum: 0 }
    MemoryChange:
      type: object
      required: [change, address, title, at]
      properties:
        change: { $ref: "events.schema.json#/$defs/ChangeId" }
        address: { $ref: "events.schema.json#/$defs/MemoryAddress" }
        title: { type: string }
        at: { $ref: "events.schema.json#/$defs/Timestamp" }
        before:
          description: The page's Markdown before the change. Absent for a new page.
          type: string
        after:
          description: The page's Markdown after the change. Absent when Ari deleted it.
          type: string
    CapabilityId:
      description: Lowercase letters, digits and dashes, such as `reports`.
      type: string
      pattern: ^[a-z][a-z0-9-]{0,31}$
    CapabilityList:
      type: object
      required: [capabilities]
      properties:
        capabilities:
          type: array
          items: { $ref: "#/components/schemas/Capability" }
    Capability:
      description: A capability, as Settings shows it.
      type: object
      required: [id, kind, title, summary, version, state, fields, uses]
      properties:
        id: { $ref: "#/components/schemas/CapabilityId" }
        kind:
          description: "`domain` for a topic of your life (Your life), `hand` for a way Ari acts (Ari's hands)."
          enum: [domain, hand]
        title:
          description: Its name, such as Reports.
          type: string
        summary:
          description: One sentence on what it does.
          type: string
        symbol:
          description: An SF Symbol name to show beside it. Absent when it names none; show a default.
          type: string
        version:
          description: The capability's own version, as `MAJOR.MINOR`.
          type: string
          pattern: ^\d+\.\d+$
        state:
          description: |
            `off` until you switch it on; `setup` while it's on but its setup isn't complete; `on` when
            it's working; `needs_you` when it's on but isn't working, with `detail` saying why.
          enum: [off, setup, on, needs_you]
        detail:
          description: "`needs_you` only: what's wrong, in plain words, such as GitHub rejected the token."
          type: string
        fields:
          description: Its setup sheet's fields, in order.
          type: array
          items: { $ref: "#/components/schemas/CapabilityField" }
        uses:
          description: What it reaches beyond its own folder, to show before you switch it on.
          type: object
          required: [hosts, folders]
          properties:
            hosts: { type: array, items: { type: string } }
            folders: { type: array, items: { type: string } }
      example:
        id: reports
        kind: hand
        title: Reports
        summary: Files the gaps Ari hits as public issues on Ito's repositories.
        symbol: exclamationmark.bubble
        version: "0.1"
        state: needs_you
        detail: GitHub rejected the token.
        fields:
          - name: token
            kind: secret
            title: GitHub token
            description: A fine-grained token for akai-ito/ito-core, with Issues set to read and write.
            set: true
        uses: { hosts: [api.github.com], folders: [] }
    CapabilityField:
      description: |
        One field of a setup sheet. A `secret` never comes back: `set` says whether one is saved.
        Every other field carries its saved `value`, if any.
      type: object
      required: [name, kind, title]
      properties:
        name:
          type: string
          pattern: ^[a-z][a-z0-9_]*$
        kind: { enum: [text, secret, toggle, choice] }
        title: { type: string }
        description: { type: string }
        optional:
          description: True when the capability can run without it.
          type: boolean
        options:
          description: "`choice` only: what can be picked."
          type: array
          items:
            type: object
            required: [value, label]
            properties:
              value: { type: string }
              label: { type: string }
        value:
          description: "The saved value: a string, or a boolean for `toggle`. Never present for a `secret`."
          anyOf: [{ type: string }, { type: boolean }]
        set:
          description: "`secret` only: whether one is saved."
          type: boolean
    SwitchCapability:
      type: object
      required: [on]
      properties:
        on: { type: boolean }
    CapabilitySetup:
      type: object
      required: [values]
      properties:
        values:
          description: Values by field name; a string, or a boolean for `toggle`.
          type: object
          additionalProperties:
            anyOf: [{ type: string }, { type: boolean }]
    CheckResult:
      type: object
      properties:
        problem:
          description: What's wrong with the values, in plain words. Absent when they work.
          type: string
    Event:
      description: One event on the stream; the `type` field says which.
      $ref: "events.schema.json#/$defs/Event"
    Snapshot:
      $ref: "events.schema.json#/$defs/Snapshot"
    MessageAccepted:
      $ref: "events.schema.json#/$defs/MessageAccepted"
    MessageQueued:
      $ref: "events.schema.json#/$defs/MessageQueued"
    MessageRead:
      $ref: "events.schema.json#/$defs/MessageRead"
    TurnStarted:
      $ref: "events.schema.json#/$defs/TurnStarted"
    TurnStatus:
      $ref: "events.schema.json#/$defs/TurnStatus"
    StepStarted:
      $ref: "events.schema.json#/$defs/StepStarted"
    StepUpdated:
      $ref: "events.schema.json#/$defs/StepUpdated"
    StepEnded:
      $ref: "events.schema.json#/$defs/StepEnded"
    MessageStarted:
      $ref: "events.schema.json#/$defs/MessageStarted"
    MessageDelta:
      $ref: "events.schema.json#/$defs/MessageDelta"
    MessageEnded:
      $ref: "events.schema.json#/$defs/MessageEnded"
    TurnEnded:
      $ref: "events.schema.json#/$defs/TurnEnded"
    AskStarted:
      $ref: "events.schema.json#/$defs/AskStarted"
    AskEnded:
      $ref: "events.schema.json#/$defs/AskEnded"
    Ask:
      $ref: "events.schema.json#/$defs/Ask"
    Attachment:
      $ref: "events.schema.json#/$defs/Attachment"
    Notification:
      $ref: "push.schema.json#/$defs/Notification"
    Message:
      $ref: "events.schema.json#/$defs/Message"
    Step:
      $ref: "events.schema.json#/$defs/Step"
    Status:
      $ref: "events.schema.json#/$defs/Status"
    Error:
      $ref: "events.schema.json#/$defs/Error"
    Discovery:
      type: object
      required: [product, protocol]
      properties:
        product:
          const: ito
        protocol:
          description: The protocol versions this server speaks, as `MAJOR.MINOR`.
          type: array
          minItems: 1
          items:
            type: string
            pattern: ^\d+\.\d+$
    ServerInfo:
      type: object
      required: [name, version, protocol, agent, setup, capabilities]
      properties:
        name:
          description: The server's name, usually its host name.
          type: string
        version:
          description: The version of Ito the server runs.
          type: string
        protocol:
          description: The protocol version of this route, as `MAJOR.MINOR`.
          type: string
          pattern: ^\d+\.\d+$
        agent:
          type: object
          required: [name]
          properties:
            name:
              description: What the agent is called; Ari until you choose another name.
              type: string
            model:
              description: |
                The model the agent runs on: the one chosen with `PUT /v0/agent`, or otherwise the one it
                last ran on, as its engine names it. Absent until either has happened.
              type: string
            effort:
              description: How hard it thinks on that model, as the engine names it, such as `low`.
              type: string
            account:
              description: How the agent's engine is signed in, as of its last run. Never the whole email address.
              type: object
              required: [kind]
              properties:
                kind:
                  description: "`chatgpt` for a ChatGPT sign-in, `api_key` for an API key, `other` for anything else."
                  enum: [chatgpt, api_key, other]
                plan:
                  description: "`chatgpt` only: the plan, such as `plus` or `pro`."
                  type: string
                email_domain:
                  description: "`chatgpt` only: the domain of the account's email, such as `gmail.com`."
                  type: string
        setup:
          description: What's set up on the server, so the app can say so in Settings rather than mid-conversation.
          type: object
          required: [notifications, memory_backup]
          properties:
            notifications:
              description: Whether the server can send push notifications (`ito push setup`).
              type: boolean
            memory_backup:
              description: |
                Whether memory is backed up: true once `ito memory remote` has set where to push it
                and the last day's pushes went through.
              type: boolean
        capabilities:
          description: The capabilities that are on, with their versions, so the app knows which screens it can show.
          type: array
          items:
            type: object
            required: [id, version]
            properties:
              id: { $ref: "#/components/schemas/CapabilityId" }
              version:
                description: The capability's own version, as `MAJOR.MINOR`.
                type: string
                pattern: ^\d+\.\d+$
    SendMessage:
      type: object
      required: [id]
      anyOf:
        - required: [text]
          properties:
            text: { type: string, pattern: \S }
        - required: [attachments]
          properties:
            attachments: { type: array, minItems: 1 }
      properties:
        id:
          description: A random UUID the app makes when you tap Send. It is the message's id and its retry key.
          type: string
          format: uuid
        text:
          description: What you wrote, as plain text or Markdown. It may be empty, or left out, when the message carries attachments.
          type: string
          maxLength: 32000
        answers:
          $ref: "events.schema.json#/$defs/AskId"
          description: The ask this message answers, when you tap one of its options or answer a secret. When it names a secret ask, the text is never stored, even if the ask has stopped waiting. An ask the server doesn't know is an `invalid_request`.
        attachments:
          description: The photos and files to attach, uploaded first, in order, each once. Naming one the server doesn't have is an `attachment_missing`. Naming one another message already carries, or attaching anything to a secret answer, is an `invalid_request`.
          type: array
          maxItems: 10
          uniqueItems: true
          items: { $ref: "events.schema.json#/$defs/UploadId" }
    MessageResult:
      type: object
      required: [message]
      properties:
        message: { $ref: "events.schema.json#/$defs/Message" }
    MessagePage:
      type: object
      required: [messages, steps, asks, calls, topics, has_more]
      properties:
        messages:
          description: Oldest first.
          type: array
          items: { $ref: "events.schema.json#/$defs/Message" }
        steps:
          description: Every step from the first of these messages up to the message the page ends before, in position order.
          type: array
          items: { $ref: "events.schema.json#/$defs/Step" }
        asks:
          description: Every ask in the same span, in position order.
          type: array
          items: { $ref: "events.schema.json#/$defs/Ask" }
        calls:
          description: Every call that started in the same span, in position order.
          type: array
          items: { $ref: "events.schema.json#/$defs/Call" }
        topics:
          description: The topics Ari marked on these messages, in position order.
          type: array
          items: { $ref: "events.schema.json#/$defs/Topic" }
        has_more:
          description: Whether even older messages exist.
          type: boolean
    StopTurn:
      type: object
      properties:
        cut:
          description: Where the message still being written was on your screen when you tapped Stop. Without it, the server keeps everything written so far. A cut that names a message which already finished changes nothing; a finished message keeps all its text.
          type: object
          required: [message, offset]
          properties:
            message: { $ref: "events.schema.json#/$defs/MessageId" }
            offset:
              description: How much of the message's text you saw, in UTF-16 code units.
              type: integer
              minimum: 0
    StopResult:
      type: object
      required: [turn, state]
      properties:
        turn: { $ref: "events.schema.json#/$defs/TurnId" }
        state:
          description: "`stopping` until the agent has stopped; `ended` if the turn had already ended."
          enum: [stopping, ended]
        outcome:
          $ref: "events.schema.json#/$defs/Outcome"
          description: How the turn ended, when `state` is `ended`.
    RetryResult:
      type: object
      required: [turn, retry_of]
      properties:
        turn:
          $ref: "events.schema.json#/$defs/TurnId"
          description: The new attempt.
        retry_of:
          $ref: "events.schema.json#/$defs/TurnId"
          description: The failed turn.
    AttachmentResult:
      type: object
      required: [attachment]
      properties:
        attachment: { $ref: "events.schema.json#/$defs/Attachment" }
    Pair:
      type: object
      required: [code, device_name]
      properties:
        code:
          description: The code from the QR code, with or without its dash, in any case.
          type: string
          minLength: 8
          maxLength: 16
        device_name:
          description: What to call this device, such as "Sam's iPhone"; `ito pair` shows it when pairing succeeds.
          type: string
          minLength: 1
          maxLength: 80
    PairResult:
      type: object
      required: [token]
      properties:
        token:
          description: "This device's token. Send it as `Authorization: Bearer <token>`."
          type: string
    AskResult:
      type: object
      required: [ask]
      properties:
        ask: { $ref: "events.schema.json#/$defs/Ask" }
    RegisterDevice:
      type: object
      required: [apns_token, environment, notification_key]
      properties:
        apns_token:
          description: The device token from Apple Push Notification service, in hex.
          type: string
          pattern: ^[0-9a-f]{64,200}$
        environment:
          description: "`sandbox` for builds from Xcode, `production` for TestFlight and the App Store."
          enum: [sandbox, production]
        notification_key:
          description: A random 256-bit key the device made for its notifications, base64. The server encrypts each notification's text with it (AES-256-GCM), so Apple sees only ciphertext.
          type: string
          pattern: ^[A-Za-z0-9+/]{43}=$
    Device:
      type: object
      required: [id, environment, key_id, registered_at]
      properties:
        id:
          description: The device's id, as the app made it.
          type: string
          format: uuid
        environment:
          enum: [sandbox, production]
        key_id:
          description: Names the current key in each notification's `ito.k`, as the first 8 hex characters of the key's SHA-256.
          type: string
          pattern: ^[0-9a-f]{8}$
        registered_at: { $ref: "events.schema.json#/$defs/Timestamp" }
    DeviceResult:
      type: object
      required: [device]
      properties:
        device: { $ref: "#/components/schemas/Device" }
    Presence:
      type: object
      required: [looking]
      properties:
        looking:
          description: Whether the conversation is on this device's screen.
          type: boolean
    ErrorResult:
      type: object
      required: [error]
      properties:
        error: { $ref: "events.schema.json#/$defs/Error" }
