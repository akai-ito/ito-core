openapi: 3.1.0
info:
  title: Ito client API
  version: "0.19"
  summary: Commands in, one resumable event stream out.
  description: |
    The API that Ari, and any other client, uses to talk to an Ito server.

    - **Discover** which protocol versions a server speaks with `GET /.well-known/ito`, before
      you have a token.
    - **Authenticate** every other request with `Authorization: Bearer <token>`. `ito serve`
      prints the token once, when it creates it.
    - **Listen** on `GET /v0/events`, one Server-Sent Events stream that carries everything the
      server says. Resume with `Last-Event-ID` after any disconnect.
    - **Send** with `POST /v0/messages`. The app chooses the message id, so retrying is always
      safe.
    - **Share** a link, a screenshot, a photo or a quick thought from the phone's share sheet with
      `POST /v0/shares`. Kumo puts it in the side thread it belongs in, or a new one it names, and
      answers it there.
    - **Stop** a turn, or **try again** after one failed, with commands on the turn.
    - **Pair** a new app by exchanging the short-lived code in the QR code `ito pair` shows for a
      token of its own.
    - **Attach** photos and files: upload each one, then name them in a message. Big files, such as
      a recording, go up in chunks that resume after any drop.
    - **Recordings:** a recording you send is transcribed on the server, with times and who spoke,
      for Kumo to read; follow it, read and correct its transcript, and delete it.
    - **Answer** what the agent asks by sending a message, or cancel the ask.
    - **Shaped replies:** a reply may hold [`ari:` blocks](blocks.schema.json) the app draws
      natively: places, choices, pictures, things in motion, files to look at and changes to approve.
    - **Files to review:** a file Kumo made or changed, such as a PDF, shown in the chat at one
      version, with its bytes exactly as made; every version stays until you delete the file.
    - **Notify** a device: register it, and every reply, ask and message from Kumo reaches it at
      once. [The push schema](push.schema.json) describes what it receives.
    - **Set up capabilities:** list what's installed with the server, switch each one on or off,
      and fill in its setup sheet, or connect it through its provider.
    - **Kumo's browser:** follow what Kumo is doing on a site as a line in its thread, peek at the
      live view, and take the page over when Kumo needs your hand, then hand it back.
    - **Understanding you:** the questions Kumo would like you to explain, on its learning tracks,
      each with what it already understands, the missing piece and why it would help. Answer with a
      tap, your own words or your voice, or say none fit, not sure or not now. Quiet and optional:
      nothing is due, and nothing notifies.
    - **Kumo's dream:** once a day Kumo looks back over the whole day and puts it in order; read the
      latest dream's record of what it planned, tidied, noticed and saved for you, mark it seen, ask
      for one now, and set the dream time.
    - **Read memory:** what's in Ari's mind, the shelves and their pages with a line on each, the
      journal, the photos a page keeps with its story, the chapters of your life Ari noticed, what
      it learnt about you lately, what Ari changed lately and why, and what each change changed.
      Ari writes memory itself; the API only reads it, and backs it up to GitHub.
    - **Choose the model** the agent runs on, and how hard it thinks, from those its engine offers.
    - **Talk:** start and end a call with the agent, and stream it: your microphone up, Ari's voice
      down, with states and captions. The server hears your turns, steered toward the names in
      memory, and posts each as a spoken message.
    - **Ari's voice:** whether the server can hold a call, the voices Ari can speak in, choosing
      one, and hearing it speak.

    **Versioning.** Routes carry the protocol's major version, and every response carries an
    `Ito-Protocol` header with the full version. Until 1.0, every protocol change may break, so
    an app and a server must speak the same `0.MINOR`. Apps ignore fields and event types they
    don't recognise; servers ignore unknown request fields.

    **Retries.** Every command is idempotent: sending a message again with the same id, repeating
    a stop, or repeating a try again has the effect of doing it once. Retry network errors,
    `429` and `5xx` responses with backoff, honouring `Retry-After`.

    **Errors.** A refused command answers with an HTTP status and an `error` object: a stable
    `code`, a plain `message` for the person using the app, and a technical `detail`.
  license:
    name: PolyForm Noncommercial 1.0.0 or PolyForm Small Business 1.0.0
    identifier: PolyForm-Noncommercial-1.0.0 OR PolyForm-Small-Business-1.0.0
servers:
  - url: https://{host}
    description: Your Ito server, reached over HTTPS (for example through Tailscale).
    variables:
      host:
        default: studio.example.ts.net
security:
  - token: []
tags:
  - name: Connecting
    description: Find out what a server speaks and who it is.
  - name: Conversation
    description: Follow everything on one event stream.
  - name: Onboarding
    description: Getting started, with what Kumo found and the beliefs it checks with you.
  - name: Desk
    description: Home, with Kumo's plans, Coming up, Waiting on you, Kumo's work and the calendar.
  - name: Understanding
    description: |
      Understanding you: the deeper questions Kumo would like you to explain, which grow out of its
      learning tracks (Getting to know you). Optional and quiet: a question has no due date, is never
      overdue, never waits on the Desk and never notifies. An answer is enough: it becomes evidence on
      its track, and Kumo files what it learned in the background with no follow-up.
  - name: Dream
    description: |
      Kumo's dream: once a day, at a time you set, Kumo looks back over the whole day and puts
      everything in order, then leaves a record of what it planned, tidied, noticed and saved for you.
  - name: Attachments
    description: Upload the photos and files you attach to messages, and fetch them again.
  - name: Threads
    description: |
      Side threads beside the main chat, each with its own conversation: list and search them, open
      one, rename it, mark it done or open, and move a message between them.
  - name: Sharing
    description: |
      What you share with Kumo from the phone's share sheet: links, screenshots, photos and quick
      thoughts. Kumo answers each in a side thread.
  - name: Recordings
    description: |
      The recordings you send, transcribed on the server for Kumo to read, with times and, as a best
      guess, who spoke. Audio and transcript stay on the server until you delete them. Kumo quotes a
      moment as a Markdown link, such as `[18:42](recording:<attachment>?t=18:42)`, with `t` as
      `m:ss`, `h:mm:ss` or seconds; the app opens the transcript there.
  - name: Files
    description: |
      Files Kumo showed you in the chat to look at, such as a PDF it made, with every version. Each
      version is an attachment whose bytes never change.
  - name: Turns
    description: Control the agent's work on a turn.
  - name: Asks
    description: Settle what the agent asked you.
  - name: Notifications
    description: Reach you through push notifications.
  - name: Capabilities
    description: Switch capabilities on and off, and set them up.
  - name: Browser
    description: |
      Kumo's browser on the server, a capability: what it's doing, its live view, and taking the page
      over for a login, a code, a CAPTCHA or the pay button, then handing it back.
  - name: Memory
    description: Read what Ari remembers, and back it up. Ari writes it; apps only read.
  - name: Motion
    description: |
      Things in motion that Kumo keeps for you, such as a trip being planned or a role you're
      interviewing for. Kumo writes them; apps read them and tick their items. In motion shows them
      in fixed sections by kind (Career, Body, Trips, Projects, Learning, Other), loudest first by
      the salience Kumo judges, and ended things in History by their outcome: never a `duplicate`,
      a `test` or small admin kept `elsewhere`.
  - name: Made
    description: |
      Pages Ari made for you, such as a gallery guide, for the Made shelf and the cards in the chat.
      Ari writes and keeps them current; apps read them and tick their items.
  - name: Model
    description: Choose the model the agent runs on.
  - name: Access
    description: How Kumo runs on the server, in its sandbox or with full access.
  - name: Talk
    description: Call the agent and speak your messages.
  - name: Whereabouts
    description: Where you roughly are, for your time zone and the weather on the Desk.
paths:
  /.well-known/ito:
    get:
      tags: [Connecting]
      operationId: discover
      summary: Discover the protocol versions
      description: |
        Open to anyone, and unversioned, so it works across majors. An app compares these
        versions with its own before sending the token, and says which side to update when they
        don't match.
      security: []
      responses:
        "200":
          description: The versions this server speaks.
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Discovery" }
              example:
                product: ito
                protocol: ["0.9"]
        "429": { $ref: "#/components/responses/SlowDown" }
  /v0/pair:
    post:
      tags: [Connecting]
      operationId: pair
      summary: Exchange a pairing code for a token
      description: |
        The code comes from the QR code `ito pair` shows on the server, which holds
        `ito://pair?address=…&code=…`. A code works once, for five minutes. The answer is a token
        for this device alone: keep it like the token `ito serve` printed, since the server keeps only
        its hash, and `ito token new` still replaces every token at once. A wrong, used or expired
        code is refused, and repeated wrong codes are slowed down like wrong tokens.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Pair" }
            example: { code: 7F3K-92QD, device_name: Sam's iPhone }
      responses:
        "201":
          description: Paired; this is the device's token.
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PairResult" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/PairingCodeRejected" }
        "429": { $ref: "#/components/responses/SlowDown" }
  /v0/server:
    get:
      tags: [Connecting]
      operationId: getServer
      summary: Check the token and meet the server
      description: The first authenticated call when connecting; it names the server and the agent.
      responses:
        "200":
          description: The token is accepted.
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServerInfo" }
              example:
                name: studio
                version: 0.9.0
                protocol: "0.9"
                lead: { name: Kumo }
                agent:
                  model: gpt-6.1-sol
                  effort: low
                  account: { kind: chatgpt, plan: plus, email_domain: example.com }
                setup: { notifications: true, memory_backup: true }
                capabilities: [{ id: reports, version: "0.2" }]
        "401": { $ref: "#/components/responses/TokenRejected" }
        "429": { $ref: "#/components/responses/SlowDown" }
  /v0/problems:
    get:
      tags: [Connecting]
      operationId: getProblems
      summary: Read what's wrong on the server
      description: |
        What's wrong on the server right now and how to fix each: notifications that can't be
        sent, a mail or calendar account that keeps failing (a refused sign-in at once, anything
        else after ten minutes), a capability that needs setting up, or memory that isn't
        reaching its backup. Each clears on its own once it's fixed. `problems.changed` carries every change, and the snapshot holds the list
        while it isn't empty.
      responses:
        "200":
          description: The problems, empty when nothing is wrong.
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
          content:
            application/json:
              schema:
                type: object
                required: [problems]
                properties:
                  problems:
                    type: array
                    items: { $ref: "events.schema.json#/$defs/Problem" }
        "401": { $ref: "#/components/responses/TokenRejected" }
  /v0/events:
    get:
      tags: [Conversation]
      operationId: streamEvents
      summary: Follow the conversation and the Desk
      description: |
        One long-lived `text/event-stream` response that carries every event, in order. Each
        Server-Sent Event has an `id:` line (the event's id) and a `data:` line (the event as JSON,
        described by [the events schema](events.schema.json)). A comment line, `: ping`, arrives at
        least every 15 seconds; treat 45 seconds of silence as a dead connection and reconnect.

        Send the id of the last event you applied as `Last-Event-ID` to resume: you receive every
        later event exactly once. When the server can't resume from it (there was none, it doesn't
        know it, or you are too far behind), the stream starts with a `snapshot` instead; replace
        your view of the conversation and of the Desk with it.

        A turn runs to its end whether or not anyone is connected.
      parameters:
        - name: Last-Event-ID
          in: header
          required: false
          description: The id of the last event you applied.
          schema: { $ref: "events.schema.json#/$defs/EventId" }
      responses:
        "200":
          description: The event stream.
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
          content:
            text/event-stream:
              schema:
                type: string
                description: Server-Sent Events, each carrying one event from the events schema.
              example: |
                id: e_0042
                data: {"id":"e_0042","type":"turn.status","at":"2026-10-12T09:41:01.200Z","turn":"t_0007","kind":"working","label":"Searching the web for riverside cafés"}

                : ping
        "401": { $ref: "#/components/responses/TokenRejected" }
        "429": { $ref: "#/components/responses/SlowDown" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v0/onboarding:
    get:
      tags: [Onboarding]
      operationId: getOnboarding
      summary: Read how getting started is going
      description: |
        Where getting started stands: the catch-up's progress while Kumo reads, then what it found:
        beliefs to confirm, bookings it added and what it put in motion. `onboarding.changed`
        carries every change, and the snapshot holds it until getting started is done. The short
        talk is the conversation's first messages: Kumo asks in ordinary messages, and you answer
        with `POST /v0/messages`.
      responses:
        "200":
          description: The state.
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
          content:
            application/json:
              schema: { $ref: "events.schema.json#/$defs/Onboarding" }
        "401": { $ref: "#/components/responses/TokenRejected" }
  /v0/onboarding/done:
    post:
      tags: [Onboarding]
      operationId: finishOnboarding
      summary: Finish getting started
      description: |
        Marks getting started done once the app has shown what Kumo found. Every app hears
        `onboarding.changed` with `done`, and the snapshot leaves `onboarding` out from then on.
        Finishing again changes nothing.
      responses:
        "200":
          description: Done.
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
          content:
            application/json:
              schema: { $ref: "events.schema.json#/$defs/Onboarding" }
        "401": { $ref: "#/components/responses/TokenRejected" }
  /v0/onboarding/replay:
    post:
      tags: [Onboarding]
      operationId: replayOnboarding
      summary: Run getting started again
      description: |
        Opens getting started again once it's done, to see it again. Nothing is wiped: accounts
        already connected stay connected, and the 90-day catch-up runs only for an account that
        connects now. Without one, Kumo names what it believes from memory, and the proposal's
        `motions` is everything in motion now. Every app hears `onboarding.changed` with `reading`,
        and Kumo asks its first question again as a post. While getting started runs, it changes
        nothing.
      responses:
        "200":
          description: Getting started, open again.
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
          content:
            application/json:
              schema: { $ref: "events.schema.json#/$defs/Onboarding" }
        "401": { $ref: "#/components/responses/TokenRejected" }
  /v0/onboarding/beliefs/{belief}:
    post:
      tags: [Onboarding]
      operationId: answerBelief
      summary: Confirm or correct a belief
      description: |
        Says a belief is true, or corrects it in your words; Kumo fixes its memory from the correction
        in the background, and the belief's `answer` follows in `onboarding.changed`.
      parameters:
        - name: belief
          in: path
          required: true
          schema: { $ref: "events.schema.json#/$defs/BeliefId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BeliefAnswer" }
            example: { correction: "Training for the Valencia half now, not a 5K." }
      responses:
        "202":
          description: Taken.
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/TokenRejected" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v0/messages:
    post:
      tags: [Conversation]
      operationId: sendMessage
      summary: Send a message
      description: |
        Answers as soon as the message is on the server's disk, without waiting for the agent.
        What happens next arrives on the event stream: `turn.started` when it starts a turn,
        `message.read` when the agent takes it into the running turn, or `message.queued` when it
        waits as Next. Send waiting messages one at a time, in order, each answered before the
        next.

        Sending the same id again returns the same message and changes nothing.

        To attach photos or files, upload each one first with `PUT /v0/attachments/{attachment}`,
        then name them in `attachments`; the text may then be empty. An attachment belongs to one
        message. If one isn't on the server, because no message named it for a day, the message is
        refused with `attachment_missing`: upload its attachments again under the same ids, then
        send the same message again.

        While an ask waits where the message goes, the message answers it: `message.accepted` for
        the message comes first, then `ask.ended`. To reply to an entry in the Done list, name it in
        `done`.

        A message goes to the main chat unless it says otherwise. Name a `thread` to send it there;
        a done thread opens again. Name a message in `reply_to` to reply to it: one in the main chat
        gets a thread under it (`thread.started` comes first when it's the first reply), and Kumo
        names that thread after its first answer; one in a thread is quoted there. Set `new_thread`
        to start a thread of your own with this message. Each thread has its own turns, so a message
        in one never steers or waits behind another.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SendMessage" }
            example:
              id: 5b6c0a3e-8d1f-4c2a-9e7b-3f1d2c4b5a69
              text: Plan my Saturday, a long run in the morning, then something calm.
      responses:
        "201":
          description: Accepted for the first time.
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageResult" }
        "200":
          description: Already accepted earlier; nothing changed.
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageResult" }
        "400":
          description: >-
            The request is malformed or not possible now (`invalid_request`), or an attachment it
            names isn't on the server (`attachment_missing`).
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResult" }
              example:
                error:
                  code: attachment_missing
                  message: A photo or file in this message isn't on the server.
                  detail: Uploads no message names are deleted after a day. Upload this message's attachments again, then send it again.
        "401": { $ref: "#/components/responses/TokenRejected" }
        "409": { $ref: "#/components/responses/IdConflict" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "429": { $ref: "#/components/responses/SlowDown" }
        "503": { $ref: "#/components/responses/Unavailable" }
    get:
      tags: [Conversation]
      operationId: listMessages
      summary: Read older messages
      description: |
        The messages just before a given one, oldest first, with the agent's steps among them,
        from the same place as that message: the main chat, or its thread. The newest messages come
        from the event stream's `snapshot`, or from `GET /v0/threads/{thread}`, so `before` is
        always required. A `404` means the server doesn't know that message (it was restored from a
        backup): reconnect to the event stream for a snapshot.
      parameters:
        - name: before
          in: query
          required: true
          description: Return messages older than this one, from where it is.
          schema: { $ref: "events.schema.json#/$defs/MessageId" }
        - name: limit
          in: query
          required: false
          description: How many messages to return.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: A page of older messages.
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessagePage" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/TokenRejected" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/SlowDown" }
  /v0/done:
    get:
      tags: [Desk]
      operationId: listDone
      summary: Read what Kumo did
      description: |
        The Done list, newest first: what Kumo did without you, and the mail it read and
        left alone (`quiet`), each with its reason. Page back with `before`.
      parameters:
        - name: before
          in: query
          required: false
          description: Return entries older than this one.
          schema: { $ref: "events.schema.json#/$defs/DoneId" }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: A page of entries.
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DonePage" }
        "401": { $ref: "#/components/responses/TokenRejected" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v0/wakeups:
    get:
      tags: [Desk]
      operationId: listWakeUps
      summary: List Kumo's plans
      description: |
        Every wake-up, soonest first: what Kumo will look at for you, and when. The Desk's `plans`
        carries the same list.
      responses:
        "200":
          description: The wake-ups.
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WakeUpList" }
        "401": { $ref: "#/components/responses/TokenRejected" }
  /v0/wakeups/{wake_up}:
    patch:
      tags: [Desk]
      operationId: changeWakeUp
      summary: Move or change one of Kumo's plans
      description: |
        Moves a wake-up to another time, changes how it repeats (`null` makes it a one-off), or
        renames or rewords it. The answer is the wake-up as it is now, and `desk.changed` follows.
        A time that has passed is refused.
      parameters:
        - $ref: "#/components/parameters/WakeUp"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WakeUpChange" }
            example: { at: "2026-11-12T17:00:00.000Z" }
      responses:
        "200":
          description: Changed.
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WakeUpResult" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/TokenRejected" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Desk]
      operationId: cancelWakeUp
      summary: Cancel one of Kumo's plans
      description: Cancels a wake-up, and `desk.changed` follows. Kumo sees it's gone and doesn't set it again unasked.
      parameters:
        - $ref: "#/components/parameters/WakeUp"
      responses:
        "204":
          description: Cancelled.
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
        "401": { $ref: "#/components/responses/TokenRejected" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v0/done/{entry}/undo:
    post:
      tags: [Desk]
      operationId: undoDone
      summary: Take back something Kumo did
      description: |
        Undoes an entry whose `undo` is true, such as moving a binned mail back to the inbox. The
        entry stays in the list, marked undone in its text.
      parameters:
        - name: entry
          in: path
          required: true
          schema: { $ref: "events.schema.json#/$defs/DoneId" }
      responses:
        "200":
          description: Undone.
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DoneResult" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/TokenRejected" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v0/done/{entry}/wrong:
    post:
      tags: [Desk]
      operationId: correctDone
      summary: Tell Kumo it got something wrong
      description: |
        "That was wrong", on anything Kumo did. Kumo undoes it where it can (as with
        `POST /v0/done/{entry}/undo`, and otherwise with its own tools in the background), keeps what
        to do differently as a preference, and records that in Done. Say what was wrong in `text`, or
        send `{}` and Kumo works it out. The answer is the entry, with `corrected_at`. Saying it again
        only adds your words.
      parameters:
        - name: entry
          in: path
          required: true
          schema: { $ref: "events.schema.json#/$defs/DoneId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CorrectDone" }
            example: { text: I needed that one }
      responses:
        "200":
          description: Noted.
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DoneResult" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/TokenRejected" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v0/desk:
    get:
      tags: [Desk]
      operationId: getDesk
      summary: Read the Desk
      description: |
        Home: Kumo's plans, Coming up, Waiting on you, how much Kumo handled today and when it last
        read your mail. The snapshot carries it too, and `desk.changed` carries the whole Desk
        whenever it changes.
      responses:
        "200":
          description: The Desk.
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
          content:
            application/json:
              schema: { $ref: "events.schema.json#/$defs/Desk" }
        "401": { $ref: "#/components/responses/TokenRejected" }
  /v0/desk/guesses/{item}/answer:
    post:
      tags: [Desk]
      operationId: answerGuess
      summary: Answer one of Kumo's guesses
      description: |
        Says whether one of Kumo's guesses at your day (a Coming up item with `guess`) was right,
        or what it really was. Kumo writes it into its calendar at once, as yours rather than a
        guess, and its next guesses learn from it. The answer is the item as it is now, and
        `desk.changed` follows.
      parameters:
        - name: item
          in: path
          required: true
          schema: { $ref: "events.schema.json#/$defs/CalendarItemId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GuessAnswer" }
            example: { activity: building }
      responses:
        "200":
          description: Answered.
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventResult" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/TokenRejected" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v0/work:
    get:
      tags: [Desk]
      operationId: getWork
      summary: Read Kumo's work today
      description: |
        Kumo's work today, local time, for "47 in: 3 need you, 6 handled, 38 cleared": what it
        handled, and the mail it read and cleared with nothing needed, each newest first with its
        reason and whether it can be undone. What needs you is the Desk's `waiting`. Another day's
        work comes with `day`; everything is in `GET /v0/done`.
      parameters:
        - name: day
          in: query
          required: false
          description: A local day, such as `2026-11-10`. Today if left out.
          schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
      responses:
        "200":
          description: Today's work.
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Work" }
        "401": { $ref: "#/components/responses/TokenRejected" }
  /v0/dream:
    get:
      tags: [Dream]
      operationId: getDream
      summary: Read Kumo's dream
      description: |
        Kumo's dream: the time it dreams each night, when the next one is, whether one is under way,
        and the latest dream's record with what it planned, tidied, noticed and saved for you. Show
        the latest as new (a moon on the Desk) until its `seen_at` is set.
      responses:
        "200":
          description: The dream.
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DreamState" }
        "401": { $ref: "#/components/responses/TokenRejected" }
    post:
      tags: [Dream]
      operationId: dreamNow
      summary: Dream now
      description: |
        Kumo dreams now, in the background, instead of waiting for the dream time; `dream.finished`
        follows when it's done, often many minutes later. One dream runs at a time: while one is
        under way this answers with it and starts nothing. Dream now is an extra: the night's dream
        still runs at the dream time, and reads only what came since.
      responses:
        "202":
          description: Dreaming.
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DreamState" }
        "401": { $ref: "#/components/responses/TokenRejected" }
  /v0/dream/time:
    put:
      tags: [Dream]
      operationId: setDreamTime
      summary: Set the dream time
      description: |
        When Kumo dreams each night, on your local clock wherever you are; 04:00 until you choose
        another. The next dream moves at once.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DreamTime" }
            example: { time: "03:30" }
      responses:
        "200":
          description: Set.
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DreamState" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/TokenRejected" }
  /v0/dreams/{dream}/seen:
    post:
      tags: [Dream]
      operationId: seeDream
      summary: Mark a dream seen
      description: |
        You've seen a dream's record, so it's no longer new: the moon on the Desk becomes the sun.
        Seeing it again keeps the first time.
      parameters:
        - $ref: "#/components/parameters/Dream"
      responses:
        "200":
          description: Seen.
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DreamResult" }
        "401": { $ref: "#/components/responses/TokenRejected" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v0/desk/cards/{card}/answer:
    post:
      tags: [Desk]
      operationId: answerCard
      summary: Answer a card
      description: |
        Answers a card waiting on you: tap one of its `options`, pick the clear `slots` of a
        `times` card, or type `text`. For a draft, `text` asks for a change, such as "a bit more
        casual", and Kumo rewrites the same draft. The card shows `state: working`, with your
        `answer`, while the box acts, then leaves the Desk when it's done, or comes back changed;
        `desk.changed` says which. Once Kumo has acted on an answer to a question, an offer or
        times, the Done list says what you answered and what followed. If Kumo couldn't act, the
        card comes back to answer again, and Done says why. The same answer sent again while the
        card is working, such as a retry, is taken once; a different one is refused. Answered on
        its card in a side thread, `thread` says which, so anything Kumo says about it goes there.
      parameters:
        - name: card
          in: path
          required: true
          schema: { $ref: "events.schema.json#/$defs/CardId" }
        - name: thread
          in: query
          required: false
          description: The thread whose card you answered it on; leave it out on the Desk or in the main chat.
          schema: { $ref: "events.schema.json#/$defs/ThreadId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CardAnswer" }
            example: { option: Accept }
      responses:
        "202":
          description: Taken; the box is acting on it.
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CardResult" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/TokenRejected" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v0/understanding:
    get:
      tags: [Understanding]
      operationId: getUnderstanding
      summary: Read Understanding you
      description: |
        Every learning track, the questions waiting quietly on them, and what you answered lately.
        `question.changed` carries each question whenever it's added or moves on.
      responses:
        "200":
          description: Understanding you.
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Understanding" }
        "401": { $ref: "#/components/responses/TokenRejected" }
  /v0/understanding/questions/{question}/answer:
    post:
      tags: [Understanding]
      operationId: answerQuestion
      summary: Answer a question
      description: |
        Answers an open question: tap one or more of its options (`picked`), say it in your own
        words (`text`) or aloud (`audio`, an audio file you uploaded first), or say `none_fit` or
        `not_sure`, alone or with your words. The question is `answered` at once, and the answer
        becomes evidence on its track. Kumo then files what it learned in the background and the
        question gains `filed`; it asks nothing more about it. A spoken answer is heard on the server
        first, and `answer.text` follows; if it can't be heard, the question opens again with
        `unheard`. The same answer sent again, such as a retry, is taken once; a different answer to
        a question that's no longer open is refused.
      parameters:
        - name: question
          in: path
          required: true
          schema: { $ref: "events.schema.json#/$defs/QuestionId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QuestionReply" }
            example: { picked: [Unplanned time], text: Nothing booked before noon. }
      responses:
        "202":
          description: Taken; Kumo files it in the background.
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuestionResult" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/TokenRejected" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v0/understanding/questions/{question}/not-now:
    post:
      tags: [Understanding]
      operationId: notNowQuestion
      summary: Say "Not now" to a question
      description: |
        Leaves an open question open, for another time, with `later_at`: no reminder follows, and
        Kumo doesn't ask it again. Saying it again only moves `later_at`.
      parameters:
        - name: question
          in: path
          required: true
          schema: { $ref: "events.schema.json#/$defs/QuestionId" }
      responses:
        "200":
          description: Left for later.
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuestionResult" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/TokenRejected" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v0/calendar/events:
    post:
      tags: [Desk]
      operationId: addEvent
      summary: Add an event to your calendar
      description: |
        Adds an event to your own iCloud calendar through the box, the one path for "Add to
        calendar". Needs the iCloud source set up.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewEvent" }
            example: { title: Call Mum, start: "2026-11-01T14:00:00Z", end: "2026-11-01T14:30:00Z" }
      responses:
        "201":
          description: Added.
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventResult" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/TokenRejected" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v0/calendar/events/{item}:
    patch:
      tags: [Desk]
      operationId: moveEvent
      summary: Move one of Kumo's blocks
      description: |
        Moves an item on Kumo's own calendar, such as a block of its plan or a guess, to a new start
        and end, within 12 hours. An event on your own calendar is refused with `invalid_request`:
        change those in Calendar. Done keeps the move with an undo, Kumo sees it when it next looks
        at your day, and `desk.changed` follows. It never wakes Kumo as a change to your calendar.
      parameters:
        - $ref: "#/components/parameters/CalendarItem"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EventMove" }
            example: { start: "2026-11-15T11:30:00.000Z", end: "2026-11-15T12:00:00.000Z" }
      responses:
        "200":
          description: Moved.
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventResult" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/TokenRejected" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
    delete:
      tags: [Desk]
      operationId: removeEvent
      summary: Remove one of Kumo's blocks
      description: |
        Removes an item from Kumo's own calendar, such as a block of its plan or a guess. An event on
        your own calendar is refused with `invalid_request`. Done keeps the removal with an undo that
        puts it back. A block in an area Kumo is learning counts as a correction on that track, and
        Kumo sees the removal when it next looks at your day. `desk.changed` follows.
      parameters:
        - $ref: "#/components/parameters/CalendarItem"
      responses:
        "204":
          description: Removed.
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/TokenRejected" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v0/lead:
    put:
      tags: [Connecting]
      operationId: renameLead
      summary: Rename Kumo
      description: Kumo is the lead's name until you choose another. `GET /v0/server` shows it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Lead" }
            example: { name: Kumo }
      responses:
        "200":
          description: Renamed.
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Lead" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/TokenRejected" }
  /v0/shares:
    post:
      tags: [Sharing]
      operationId: sendShare
      summary: Share something with Kumo
      description: |
        What the share sheet sends: any mix of a link, text from another app, photos and files, and
        a note you add. Upload photos and files first with `PUT /v0/attachments/{attachment}` (or
        in chunks, for big ones), then name them in `attachments`, as a message does.

        Answers as soon as the share is on the server's disk, with `state` `sorting`. The server
        then reads the link's page for its title and summary, where it can, and Kumo decides
        where the share belongs: one of your open side threads when it clearly belongs to that
        thread's subject, or a new thread of its own that Kumo names (`thread.started`, by
        `kumo`, comes first). The share becomes your message there, under the share's id, with
        `share` holding the link and text, and arrives as `message.accepted`. Kumo answers it in
        that thread's own turn, saying what it made of it and what it did with it, and its reply
        notifies like any other.

        Sending the same id again returns the share as it stands, `placed` once it's a message,
        and changes nothing. The same id with anything different is an `id_conflict`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SendShare" }
            example:
              id: 0f9b4c2e-6a71-4d3b-8e25-9c1a7d4e3b60
              url: https://careers.halcyon.example/jobs/platform-engineer
              note: This is the one Sam mentioned
      responses:
        "201":
          description: Accepted for the first time; Kumo is sorting it.
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShareResult" }
        "200":
          description: Already accepted earlier; nothing changed. This is where it stands.
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShareResult" }
        "400":
          description: >-
            The request is malformed or not possible now (`invalid_request`), such as an attachment
            that belongs to a message already, or an attachment it names isn't on the server
            (`attachment_missing`).
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResult" }
        "401": { $ref: "#/components/responses/TokenRejected" }
        "409": { $ref: "#/components/responses/IdConflict" }
        "429": { $ref: "#/components/responses/SlowDown" }
  /v0/threads:
    get:
      tags: [Threads]
      operationId: listThreads
      summary: List the threads
      description: |
        Every open thread, then done ones a page at a time, newest first: what Threads by day
        shows. With `query`, only threads whose name, result or messages hold all its words.
      parameters:
        - name: query
          in: query
          required: false
          description: Words to look for, such as a dish, a place or a person.
          schema: { type: string, maxLength: 200 }
        - name: before
          in: query
          required: false
          description: Return done threads older than this one.
          schema: { $ref: "events.schema.json#/$defs/ThreadId" }
        - name: limit
          in: query
          required: false
          description: How many done threads to return.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: The threads.
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ThreadList" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/TokenRejected" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v0/threads/{thread}:
    get:
      tags: [Threads]
      operationId: getThread
      summary: Open a thread
      description: |
        The thread with its latest messages, its steps and asks, and its running turn, as a
        snapshot does for the main chat. Events for it keep arriving on the event stream: apply
        the ones after this to it.
      parameters:
        - $ref: "#/components/parameters/Thread"
      responses:
        "200":
          description: The thread.
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ThreadPage" }
        "401": { $ref: "#/components/responses/TokenRejected" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Threads]
      operationId: changeThread
      summary: Rename a thread, or mark it done or open
      description: |
        `thread.changed` follows on the event stream. Marking a done thread done, or an open one
        open, changes nothing.
      parameters:
        - $ref: "#/components/parameters/Thread"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ThreadChange" }
            example: { title: Kiln menu }
      responses:
        "200":
          description: The thread as it is now.
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ThreadResult" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/TokenRejected" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v0/threads/{thread}/seen:
    post:
      tags: [Threads]
      operationId: seeThread
      summary: Say you've seen a thread's news
      description: |
        Clears its `news`, on every app, with `thread.changed`. Opening a thread, or a notification
        about it, sends this; replying in it does the same on its own.
      parameters:
        - $ref: "#/components/parameters/Thread"
      responses:
        "200":
          description: The thread as it is now.
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ThreadResult" }
        "401": { $ref: "#/components/responses/TokenRejected" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v0/messages/{message}/move:
    post:
      tags: [Threads]
      operationId: moveMessage
      summary: Move a message to another thread
      description: |
        Moves one message, yours or Kumo's, into a thread or back to the main chat. It keeps its id
        and its position; `message.moved` follows, and `thread.changed` for each thread it left or
        joined. Kumo hears of the move in both places with its next turn there. A message a thread
        hangs from stays in the main chat.
      parameters:
        - $ref: "#/components/parameters/Message"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MoveMessage" }
            example: { thread: h_0001 }
      responses:
        "200":
          description: The message as it is now.
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageResult" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/TokenRejected" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v0/turns/{turn}/stop:
    post:
      tags: [Turns]
      operationId: stopTurn
      summary: Stop a turn
      description: |
        Handled ahead of everything else, and never behind a message being accepted. The server
        sends no more text for the turn and stops the agent, and the message being written keeps
        everything sent so far. `turn.ended` with outcome `stopped` follows once the agent has
        really stopped.

        If the turn has already ended, nothing changes and the answer gives its outcome.
        Messages waiting as Next are answered after the stop.
      parameters:
        - $ref: "#/components/parameters/Turn"
      responses:
        "202":
          description: The turn is stopping.
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StopResult" }
              example: { turn: t_0007, state: stopping }
        "200":
          description: The turn had already ended.
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StopResult" }
              example: { turn: t_0007, state: ended, outcome: completed }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/TokenRejected" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v0/turns/{turn}/retry:
    post:
      tags: [Turns]
      operationId: retryTurn
      summary: Try a failed turn again
      description: |
        Starts a new turn that answers the same messages, below the failed reply, which stays.
        The failed turn's id is the retry key: repeating the request returns the same new turn.
        Only a failed turn can be tried again.
      parameters:
        - $ref: "#/components/parameters/Turn"
      responses:
        "202":
          description: A new attempt has started.
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RetryResult" }
              example: { turn: t_0008, retry_of: t_0007 }
        "200":
          description: Already tried again; this is that attempt.
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RetryResult" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/TokenRejected" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v0/attachments/{attachment}:
    put:
      tags: [Attachments]
      operationId: uploadAttachment
      summary: Upload a photo or file
      description: |
        The body is the file's bytes, with its `Content-Type`. The app makes the attachment's id
        before uploading, so retrying is always safe: the same bytes again change nothing, and
        different bytes under the same id are an `id_conflict`. Upload before sending the message
        that names it. Scale photos down first (about 2048 pixels on the long edge, as JPEG): that is
        roughly what the model looks at. An attachment no message names is deleted after a day.
      parameters:
        - $ref: "#/components/parameters/Upload"
        - name: name
          in: query
          required: true
          description: The file's name, shown with the message and used in the agent's workspace.
          schema:
            type: string
            minLength: 1
            maxLength: 255
      requestBody:
        required: true
        content:
          "*/*":
            schema:
              description: The file's bytes, at most 20 MB (20 × 1024 × 1024 bytes).
      responses:
        "201":
          description: Uploaded.
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AttachmentResult" }
        "200":
          description: Already uploaded with these bytes; nothing changed.
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AttachmentResult" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/TokenRejected" }
        "409": { $ref: "#/components/responses/IdConflict" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "429": { $ref: "#/components/responses/SlowDown" }
    get:
      tags: [Attachments]
      operationId: getAttachment
      summary: Fetch an attachment's bytes
      description: |
        The bytes, exactly as they were uploaded or made, with their media type and their name in
        `Content-Disposition`. They never change, so keep them once fetched. Ask for part of a big
        file with one `Range: bytes=…` range, such as to play a recording as it downloads or to
        resume a download; the answer is a `206` with `Content-Range`.
      parameters:
        - $ref: "#/components/parameters/Attachment"
        - name: Range
          in: header
          required: false
          description: One byte range, such as `bytes=0-1048575` or `bytes=1048576-`.
          schema: { type: string }
      responses:
        "200":
          description: The file.
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
            Accept-Ranges:
              description: Always `bytes`.
              schema: { type: string }
          content:
            "*/*":
              schema:
                description: The file's bytes.
        "206":
          description: The part of the file the range asked for.
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
            Content-Range:
              description: Which bytes these are, such as `bytes 0-1048575/52428800`.
              schema: { type: string }
          content:
            "*/*":
              schema:
                description: Those bytes.
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/TokenRejected" }
        "404": { $ref: "#/components/responses/NotFound" }
        "416":
          description: The range is past the end of the file; `Content-Range` gives its size as `bytes */size`.
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
            Content-Range:
              description: The file's size, such as `bytes */52428800`.
              schema: { type: string }
        "429": { $ref: "#/components/responses/SlowDown" }
  /v0/uploads:
    get:
      tags: [Attachments]
      operationId: listUploads
      summary: See the limits, and the big uploads still going
      description: |
        What the server takes, to show before anything is uploaded: the media types and the largest
        size of each kind, the largest chunk, and what happens to a recording. Then the big uploads
        that haven't finished, so an app that was closed mid-upload can carry on from `received`.
      responses:
        "200":
          description: The limits and the unfinished uploads.
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadList" }
        "401": { $ref: "#/components/responses/TokenRejected" }
        "429": { $ref: "#/components/responses/SlowDown" }
    post:
      tags: [Attachments]
      operationId: createUpload
      summary: Start a big upload
      description: |
        For a file too big for `PUT /v0/attachments/{attachment}` (over 20 MB), such as a recorded
        conversation. Say what's coming: the id the app made, which becomes the attachment's id, the
        file's name, media type and size in bytes. Then send it in chunks with
        `PUT /v0/uploads/{upload}`, in order, and finish with `POST /v0/uploads/{upload}/finish`.
        The finished upload is an attachment like any other: name it in a message.

        Starting the same upload again changes nothing and answers where it stands, so it's also how
        an app resumes. Only the media types `GET /v0/uploads` lists are taken, each kind up to its
        size. An upload no chunk reaches for two days is deleted.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateUpload" }
            example:
              id: 6f1c1f4e-9b7a-4c52-8f0e-2b6d1f0a9c31
              name: Interview with Northwind.m4a
              media_type: audio/mp4
              size: 96468992
      responses:
        "201":
          description: Started; send the first chunk at offset 0.
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadResult" }
        "200":
          description: Already started, or finished; this is where it stands.
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadResult" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/TokenRejected" }
        "409": { $ref: "#/components/responses/IdConflict" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedType" }
        "429": { $ref: "#/components/responses/SlowDown" }
        "507": { $ref: "#/components/responses/ServerDiskFull" }
  /v0/uploads/{upload}:
    get:
      tags: [Attachments]
      operationId: getUpload
      summary: See where a big upload stands
      parameters:
        - $ref: "#/components/parameters/BigUpload"
      responses:
        "200":
          description: How much the server has, or the attachment it became.
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadResult" }
        "401": { $ref: "#/components/responses/TokenRejected" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/SlowDown" }
    put:
      tags: [Attachments]
      operationId: sendUploadChunk
      summary: Send a chunk of a big upload
      description: |
        The body is the next bytes of the file, at most `chunk_bytes` (about 8 MB is a good size),
        and `offset` says where they start. The server answers once they're on its disk, with how
        much it now has: show that as the upload's progress, and send the next chunk from there.

        Sending a chunk again is safe: bytes the server already has are skipped. A chunk that starts
        past what the server has is refused with `offset_mismatch` and the upload as it stands, so
        the app carries on from its `received`.
      parameters:
        - $ref: "#/components/parameters/BigUpload"
        - name: offset
          in: query
          required: true
          description: Where in the file this chunk starts, in bytes.
          schema:
            type: integer
            minimum: 0
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              description: The chunk's bytes.
      responses:
        "200":
          description: On disk.
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadResult" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/TokenRejected" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/OffsetMismatch" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "429": { $ref: "#/components/responses/SlowDown" }
        "507": { $ref: "#/components/responses/ServerDiskFull" }
    delete:
      tags: [Attachments]
      operationId: cancelUpload
      summary: Give up a big upload
      description: Deletes what the server has of an unfinished upload. Cancelling one that isn't there changes nothing.
      parameters:
        - $ref: "#/components/parameters/BigUpload"
      responses:
        "204":
          description: Gone.
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
        "401": { $ref: "#/components/responses/TokenRejected" }
        "429": { $ref: "#/components/responses/SlowDown" }
  /v0/uploads/{upload}/finish:
    post:
      tags: [Attachments]
      operationId: finishUpload
      summary: Finish a big upload
      description: |
        Once the server has every byte, this makes the upload an attachment, after checking that its
        first bytes fit its media type (a recording must be audio, a PDF a PDF). Give the file's
        SHA-256 to have the server check it arrived whole; when it doesn't match, the server starts
        the upload over from offset 0 and says so with `checksum_mismatch`. Finishing again answers
        the same attachment.
      parameters:
        - $ref: "#/components/parameters/BigUpload"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FinishUpload" }
      responses:
        "201":
          description: The attachment it became.
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AttachmentResult" }
        "200":
          description: Already finished; this is its attachment.
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AttachmentResult" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/TokenRejected" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/UploadIncomplete" }
        "415": { $ref: "#/components/responses/UnsupportedType" }
        "422": { $ref: "#/components/responses/ChecksumMismatch" }
        "429": { $ref: "#/components/responses/SlowDown" }
  /v0/recordings:
    get:
      tags: [Recordings]
      operationId: listRecordings
      summary: List the recordings you sent
      description: Newest first, with where each one's transcript stands. Deleted recordings aren't listed.
      responses:
        "200":
          description: The recordings.
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecordingList" }
        "401": { $ref: "#/components/responses/TokenRejected" }
        "429": { $ref: "#/components/responses/SlowDown" }
  /v0/recordings/{attachment}:
    get:
      tags: [Recordings]
      operationId: getRecording
      summary: See where a recording's transcript stands
      description: |
        Every audio attachment you send in a message becomes a recording. `recording.changed` says
        when it moves on; this is for a recording on screen after a snapshot.
      parameters:
        - $ref: "#/components/parameters/Attachment"
      responses:
        "200":
          description: The recording.
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecordingResult" }
        "401": { $ref: "#/components/responses/TokenRejected" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/SlowDown" }
    delete:
      tags: [Recordings]
      operationId: deleteRecording
      summary: Delete a recording's audio and transcript
      description: |
        Deletes the audio, its transcript and any copy in Kumo's workspace, and stops a transcription
        under way. The message stays, with the attachment's name, but its audio can't be fetched
        again. What Kumo already wrote from it, such as a summary in the chat, stays; ask Kumo to
        change what it remembers. Deleting again answers the deleted recording.
      parameters:
        - $ref: "#/components/parameters/Attachment"
      responses:
        "200":
          description: Deleted.
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecordingResult" }
        "401": { $ref: "#/components/responses/TokenRejected" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/SlowDown" }
  /v0/recordings/{attachment}/retry:
    post:
      tags: [Recordings]
      operationId: retryRecording
      summary: Transcribe a failed recording again
      description: |
        Puts a `failed` recording back in the queue, such as after installing ffmpeg on the server.
        A recording that isn't failed is answered as it is.
      parameters:
        - $ref: "#/components/parameters/Attachment"
      responses:
        "202":
          description: Queued again.
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecordingResult" }
        "200":
          description: It wasn't failed; this is where it stands.
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecordingResult" }
        "401": { $ref: "#/components/responses/TokenRejected" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/SlowDown" }
  /v0/recordings/{attachment}/transcript:
    get:
      tags: [Recordings]
      operationId: getTranscript
      summary: Read a recording's transcript
      description: |
        What was said, piece by piece, with times from the start of the recording and, where the
        server could tell voices apart, who said it, with your corrections applied. It's what the
        model heard, not a summary: Kumo reads the same words and keeps its own reading separate.
        Ask for `format=text` for plain text to share, one line per turn with its time.
      parameters:
        - $ref: "#/components/parameters/Attachment"
        - name: format
          in: query
          required: false
          description: "`json`, the default, or `text`."
          schema:
            enum: [json, text]
            default: json
      responses:
        "200":
          description: The transcript.
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TranscriptResult" }
            text/plain:
              schema:
                type: string
                example: "[0:00] Speaker 1: Thanks for making the time today.\n[0:04] You: Of course.\n"
        "401": { $ref: "#/components/responses/TokenRejected" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/NotTranscribed" }
        "429": { $ref: "#/components/responses/SlowDown" }
  /v0/recordings/{attachment}/corrections:
    post:
      tags: [Recordings]
      operationId: correctTranscript
      summary: Correct what the transcript misheard, and name its voices
      description: |
        Replace words the server misheard, such as a name or a term, everywhere they appear, and
        give voices names, such as "Interviewer" for `S1`. The words as heard are kept underneath:
        correcting the same words again replaces the earlier correction, and correcting them to
        themselves undoes it. Kumo makes the same corrections when you tell it in the chat.
      parameters:
        - $ref: "#/components/parameters/Attachment"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CorrectTranscript" }
            example:
              replace:
                - { heard: Myra, meant: Mira }
              speakers:
                - { id: S1, name: Interviewer }
      responses:
        "200":
          description: The transcript, corrected.
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TranscriptResult" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/TokenRejected" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/NotTranscribed" }
        "429": { $ref: "#/components/responses/SlowDown" }
  /v0/files:
    get:
      tags: [Files]
      operationId: listFiles
      summary: List the files Kumo showed you
      description: Newest change first, each with all its versions, for a shelf of what Kumo made.
      responses:
        "200":
          description: The files.
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FileList" }
        "401": { $ref: "#/components/responses/TokenRejected" }
        "429": { $ref: "#/components/responses/SlowDown" }
  /v0/files/{file}:
    get:
      tags: [Files]
      operationId: getFile
      summary: See a file Kumo showed you, with its versions
      description: |
        What an `ari:file` card needs: the file's versions, oldest first, each with its attachment
        (name, media type and size) and what changed. Fetch a version's bytes with
        `GET /v0/attachments/{attachment}`; they are exactly what Kumo made, and never change.
      parameters:
        - $ref: "#/components/parameters/File"
      responses:
        "200":
          description: The file.
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FileResult" }
        "401": { $ref: "#/components/responses/TokenRejected" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/SlowDown" }
    delete:
      tags: [Files]
      operationId: deleteFile
      summary: Delete a file Kumo showed you, every version
      description: |
        Deletes every version's bytes from the server, and the copies kept for mail drafts; the
        file Kumo works on in its workspace stays. Cards for it then say it's gone. Deleting one
        that isn't there changes nothing.
      parameters:
        - $ref: "#/components/parameters/File"
      responses:
        "204":
          description: Gone.
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
        "401": { $ref: "#/components/responses/TokenRejected" }
        "429": { $ref: "#/components/responses/SlowDown" }
  /v0/asks/{ask}/cancel:
    post:
      tags: [Asks]
      operationId: cancelAsk
      summary: Cancel an ask
      description: |
        What Stop does while an ask waits. The ask ends as `cancelled`, nothing is sent to the agent,
        and it learns at the start of its next turn that you didn't answer. Cancelling an ask that
        has already ended changes nothing, and the answer gives the ask as it ended.
      parameters:
        - $ref: "#/components/parameters/Ask"
      responses:
        "200":
          description: The ask, as it ended.
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AskResult" }
        "401": { $ref: "#/components/responses/TokenRejected" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v0/devices/{device}:
    put:
      tags: [Notifications]
      operationId: registerDevice
      summary: Register a device for notifications
      description: |
        Call it when the system gives the app a push token, and again whenever the token changes or
        you rotate the key (every 30 days, say). The server keeps one registration per device and
        always encrypts with its latest key. Keep the previous key on the device for a while: a
        notification already on its way names the key that encrypted it.

        The server pushes every reply when it finishes, every failed turn, every ask and every
        message Kumo posts, at once and whatever the hour; the phone's Focus decides what makes a
        sound. Only a message Kumo marks urgent is time-sensitive.
      parameters:
        - $ref: "#/components/parameters/Device"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterDevice" }
            example:
              apns_token: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
              environment: production
              notification_key: MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
      responses:
        "201":
          description: Registered for the first time.
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceResult" }
        "200":
          description: Registered again; the new token and key replace the old ones.
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceResult" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/TokenRejected" }
    delete:
      tags: [Notifications]
      operationId: removeDevice
      summary: Stop notifying a device
      description: Forgets the device, its token and its key. Removing a device the server doesn't know changes nothing.
      parameters:
        - $ref: "#/components/parameters/Device"
      responses:
        "204":
          description: The device is no longer registered.
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
        "401": { $ref: "#/components/responses/TokenRejected" }
  /v0/devices/{device}/whereabouts:
    put:
      tags: [Whereabouts]
      operationId: setWhereabouts
      summary: Say where the phone roughly is
      description: |
        Send it when the app opens and whenever the time zone or the place changes, such as on a
        trip: its time zone, and when you allow it, roughly where it is. The box keeps only the
        latest one from any device, with the place rounded to about 10 km, and never anything more
        precise.

        The time zone is the one Kumo lives by: a repeating wake-up comes back at its time there,
        and moving to another zone wakes Kumo to move what should follow you. The place gives the
        Desk the weather around you; without one, there's no `ambient`.
      parameters:
        - $ref: "#/components/parameters/Device"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Whereabouts" }
            example: { time_zone: Europe/Rome, area: { latitude: 41.9, longitude: 12.5, name: Rome } }
      responses:
        "204":
          description: Noted.
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/TokenRejected" }
  /v0/capabilities:
    get:
      tags: [Capabilities]
      operationId: listCapabilities
      summary: List the capabilities
      description: |
        Every capability installed with the server, whether it's on or not, with what Settings needs
        to show it and its setup sheet. Fetch it when Settings opens and after a change; nothing on
        the event stream says a capability changed.
      responses:
        "200":
          description: The capabilities, in the order to show them.
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CapabilityList" }
        "401": { $ref: "#/components/responses/TokenRejected" }
  /v0/capabilities/{capability}:
    put:
      tags: [Capabilities]
      operationId: switchCapability
      summary: Switch a capability on or off
      description: |
        Switching off takes effect at once: the agent can no longer use it. Its setup values stay until
        it's set up again. Switching on a capability whose setup isn't complete leaves it in `setup`.
      parameters:
        - $ref: "#/components/parameters/Capability"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SwitchCapability" }
            example: { on: true }
      responses:
        "200":
          description: The capability, as the list now shows it.
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Capability" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/TokenRejected" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v0/capabilities/{capability}/setup:
    put:
      tags: [Capabilities]
      operationId: setUpCapability
      summary: Save a capability's setup
      description: |
        The values merge into what's saved: leave out a secret to keep it, or send `""` to clear a
        field. A secret is never sent back to any app. A capability that's on restarts with the new
        values, and the answer says whether it took them.
      parameters:
        - $ref: "#/components/parameters/Capability"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CapabilitySetup" }
            example: { values: { token: github_pat_example } }
      responses:
        "200":
          description: The capability, as the list now shows it.
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Capability" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/TokenRejected" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v0/capabilities/{capability}/connect:
    post:
      tags: [Capabilities]
      operationId: connectCapability
      summary: Connect it through its provider
      description: |
        For a capability with an `oauth_device` field in its setup. The server asks the provider for a
        code and answers with it and the page to enter it on: show the code, and open the page, where
        you're already signed in. Once you approve there, the provider hands the server the value,
        which the server saves as setup would, restarting the capability; the value never reaches the
        app. `GET /v0/capabilities` shows the field `set` once it's in. Connecting again starts over
        with a new code. The code stops working at `expires_at`.
      parameters:
        - $ref: "#/components/parameters/Capability"
      responses:
        "200":
          description: The code to approve, and where.
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CapabilityConnection" }
              example:
                code: WDJB-MJHT
                url: https://github.com/login/device
                expires_at: "2026-10-30T09:15:00.000Z"
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/TokenRejected" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v0/capabilities/{capability}/check:
    post:
      tags: [Capabilities]
      operationId: checkCapability
      summary: Test setup values
      description: |
        *Test connection*: the capability tries the values, merged into what's saved, without saving
        them. The answer is empty when they work, or says what's wrong.
      parameters:
        - $ref: "#/components/parameters/Capability"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CapabilitySetup" }
            example: { values: { token: github_pat_example } }
      responses:
        "200":
          description: Whether the values work.
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckResult" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/TokenRejected" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v0/capabilities/browser/state:
    get:
      tags: [Browser]
      operationId: getBrowser
      summary: See what Kumo's browser is doing
      description: |
        The state `browser.changed` carries and the snapshot holds. Only while the browser capability
        is on; otherwise the answer is `unavailable`.
      responses:
        "200":
          description: The browser as it stands.
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BrowserBody" }
              example:
                browser:
                  state: browsing
                  line: "On OpenTable: choosing Sat 19:30 · step 6"
                  thread: h_7f9q7h33a4pb
                  site: OpenTable
                  url: https://www.opentable.example/booking/details
                  title: Complete your reservation
                  doing: choosing Sat 19:30
                  step: 6
        "401": { $ref: "#/components/responses/TokenRejected" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v0/capabilities/browser/takeover:
    post:
      tags: [Browser]
      operationId: takeOverBrowser
      summary: Take the page over
      description: |
        You hold the page. Kumo's actions on it are refused until you hand it back, and your touches,
        keys and text on the stream reach it. A step Kumo is in the middle of finishes first, which
        takes a few seconds at most. Taking it again moves the lease on, as every frame up does; left
        untouched for ten minutes, the page goes back to Kumo by itself. Sign in, enter a code, solve a
        CAPTCHA or press the pay button here: Kumo never sees what you type. A takeover is never an
        approval: once you hand back, Kumo reads the page again and goes on from what it finds.
      responses:
        "200":
          description: The browser, now `yours`.
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BrowserBody" }
        "401": { $ref: "#/components/responses/TokenRejected" }
        "503": { $ref: "#/components/responses/Unavailable" }
    delete:
      tags: [Browser]
      operationId: handBackBrowser
      summary: Hand the page back to Kumo
      description: |
        Kumo's old view of the page is gone, so it reads the page again before it acts. When it had
        asked for your hand, or was in the middle of a task, it's woken to carry on, in the thread the
        task lives in. Handing back a page you don't hold changes nothing.
      responses:
        "200":
          description: The browser, back with Kumo.
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BrowserBody" }
        "401": { $ref: "#/components/responses/TokenRejected" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v0/capabilities/browser/task:
    delete:
      tags: [Browser]
      operationId: stopBrowserTask
      summary: Stop Kumo's browsing task
      description: |
        Stops what Kumo is doing in the browser, for "Stop the task": a step it's in the middle of
        finishes first, then nothing more of the task is done. A takeover you hold ends, without
        waking Kumo; a need it was waiting on, and a one-tap card waiting for your tap, are dropped;
        and the page stays exactly as it is, unpressed. The turn that was browsing can't use the
        browser again, so a new ask starts afresh. The trail's hand-off says you stopped it.
        Stopping with no task changes nothing. The answer is the browser, now `idle`.
      responses:
        "200":
          description: Stopped; the browser, now `idle`.
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BrowserBody" }
        "401": { $ref: "#/components/responses/TokenRejected" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v0/capabilities/browser/stream:
    get:
      tags: [Browser]
      operationId: streamBrowser
      summary: Watch the browser live, and use it in a takeover
      description: |
        Upgrades to a WebSocket, with the token in `Authorization` as everywhere. Several can be open
        at once, one for each device; the page is streamed while any is.

        - **Binary frames down:** the page, from Chrome's own screencast: one JPEG each, the whole
          viewport at your phone's size, as soon as anything paints. While the page moves they come
          at 1x, up to 60 a second; once it's still for a moment, a sharp one at 2x follows. A slow
          connection gets fewer, never a backlog: draw the latest.
        - **Text frames** both ways are JSON, as in [the browser stream schema](browser.schema.json):
          `state`, `view`, `focus`, `mark`, `link`, `refused` and `ended` from the server; `tap`,
          `touch`, `scroll`, `text`, `fill`, `key`, `navigate` and `viewport` from the app, which
          reach the page only while you hold it. What you send reaches the page at once, in order,
          never waiting on anything else: moves and scrolls sent faster than the page takes them
          join up. `focus` gives the field with the focus, its kind, where it is and how long its
          value is, in frames from other sites too, so a native field laid over it can type with
          iOS's keyboard and fill in passwords and codes, sending each change with `fill` and
          return as `key` Enter; it comes by itself when a new page puts the focus in a field.
          `mark` gives the site's own pay button on a `payment` need, to ring, and follows it as
          the page scrolls. `viewport` tells the server how much room the page has between the
          header and the Hand back bar, and how much the keyboard covers, and the page's viewport
          is made the room above the keyboard, so nothing sits under the bar or the keyboard.
          `link` says `reconnecting` while the page should have painted and couldn't be shown, and
          `live` again once it can.

        Peeking is watching: nothing you do changes the page until you take it over with
        `POST /v0/capabilities/browser/takeover`, and Kumo carries on meanwhile.
      responses:
        "101":
          description: Switching to the WebSocket.
        "401": { $ref: "#/components/responses/TokenRejected" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v0/memory/in-mind:
    get:
      tags: [Memory]
      operationId: getInMind
      summary: What's in Ari's mind
      description: The pages that go into every turn, in order (Portrait, Now, How to help you). A page Ari hasn't written yet is left out.
      responses:
        "200":
          description: The pages, as they are now.
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemoryPages" }
        "401": { $ref: "#/components/responses/TokenRejected" }
  /v0/memory/shelves:
    get:
      tags: [Memory]
      operationId: listShelves
      summary: The shelves, with how much is on each
      description: |
        Chapters aren't among them: the Library shows them as a row of their own, from
        `listChapters`.
      responses:
        "200":
          description: Every shelf but chapters, in order, the journal last.
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShelfList" }
        "401": { $ref: "#/components/responses/TokenRejected" }
  /v0/memory/pages:
    get:
      tags: [Memory]
      operationId: listPages
      summary: The pages on a shelf
      description: Pages by title; journal days newest first.
      parameters:
        - name: shelf
          in: query
          required: true
          schema: { $ref: "#/components/schemas/Shelf" }
      responses:
        "200":
          description: The shelf's pages.
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PageList" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/TokenRejected" }
  /v0/memory/recent:
    get:
      tags: [Memory]
      operationId: listRecentChanges
      summary: What Ari changed in memory lately
      description: |
        The 20 newest changes, newest first, one row per change, each with Ari's note on what it
        changed. A page changed twice has two rows. `getChange` opens any of them.
      responses:
        "200":
          description: The changes.
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecentChanges" }
        "401": { $ref: "#/components/responses/TokenRejected" }
  /v0/memory/chapters:
    get:
      tags: [Memory]
      operationId: listChapters
      summary: The chapters of your life Ari noticed
      description: |
        Arcs Ari noticed and named, such as "Florence with Mira" or "Back to training", each a page
        on the `chapters` shelf: a short story with photos, then what changed. Those still going
        come first, the one changed most lately leading; then the rest, the latest to end first.
        `getPage` opens one.
      responses:
        "200":
          description: Every chapter.
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChapterList" }
        "401": { $ref: "#/components/responses/TokenRejected" }
  /v0/memory/learnt:
    get:
      tags: [Memory]
      operationId: listLearnt
      summary: What Ari learnt about you lately
      description: |
        The five newest lines Ari learnt about you, newest first, each in its own words to you,
        such as "Half marathons suit you more than 5Ks." A line comes only with a change to memory
        that taught Ari something about you, never with one that tidies, reconciles or fixes
        records. One Ari took back, or whose page it forgot, is gone. To correct one, you tell Ari.
      responses:
        "200":
          description: The lines.
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LearntLines" }
        "401": { $ref: "#/components/responses/TokenRejected" }
  /v0/memory/page:
    get:
      tags: [Memory]
      operationId: getPage
      summary: One page, or one journal day
      description: |
        The page's Markdown, without its front matter: the present first, then any *Earlier*
        section, as Ari wrote it. Render it as Markdown. A photo shared in the chat may stay with
        the story, as a Markdown image where it belongs; `photos` lists those memory keeps, to
        fetch with `getMemoryMedia`.
      parameters:
        - name: address
          in: query
          required: true
          schema: { $ref: "events.schema.json#/$defs/MemoryAddress" }
      responses:
        "200":
          description: The page.
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemoryPage" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/TokenRejected" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v0/memory/media/{media}:
    get:
      tags: [Memory]
      operationId: getMemoryMedia
      summary: A photo a page keeps
      description: |
        The bytes of a photo in memory, named in a page's `photos`. Ari keeps each one scaled down
        (at most 2,000 pixels on the long edge, as JPEG), named by what's in it, so its bytes never
        change: keep them once fetched.
      parameters:
        - name: media
          in: path
          required: true
          schema: { $ref: "#/components/schemas/MediaName" }
      responses:
        "200":
          description: The photo.
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
          content:
            image/*:
              schema:
                description: The photo's bytes.
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/TokenRejected" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v0/memory/changes/{change}:
    get:
      tags: [Memory]
      operationId: getChange
      summary: What a change to memory changed
      description: The page's Markdown before and after one `updated` step. `before` is absent for a new page, and `after` for a page Ari deleted.
      parameters:
        - name: change
          in: path
          required: true
          schema: { $ref: "events.schema.json#/$defs/ChangeId" }
      responses:
        "200":
          description: The change.
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemoryChange" }
        "401": { $ref: "#/components/responses/TokenRejected" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v0/memory/backup:
    get:
      tags: [Memory]
      operationId: getMemoryBackup
      summary: Read where memory is backed up
      description: |
        Whether memory is backed up off the server, where to, and when it last got there. While
        you're backing up through GitHub, read it every couple of seconds to follow along: the
        server notices on its own when you've entered the code and when the app is installed.
      responses:
        "200":
          description: How memory is backed up.
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemoryBackup" }
              example:
                state: "on"
                repository: octo-person/ito-thread
                repository_url: https://github.com/octo-person/ito-thread
                pushed_at: "2026-11-01T09:12:00.000Z"
        "401": { $ref: "#/components/responses/TokenRejected" }
    post:
      tags: [Memory]
      operationId: backUpMemory
      summary: Back memory up to GitHub
      description: |
        Connects GitHub through Ito Memory, Ito's GitHub app, and answers with the code to enter
        on GitHub's page. Once you approve it there, GitHub hands the server a token, which never
        reaches the app. The server then finds your private `ito-thread` repository, or makes one,
        and asks for the app to be installed on just that repository; once it is, memory is pushed
        there after each change. Connecting again starts over with a new code, and keeps the
        repository. Refused while memory already backs up somewhere else, set with
        `ito memory remote`: the message says how to remove that first. History already in the
        repository is kept: the server fast-forwards to it, and never pushes over changes made on
        both sides.
      responses:
        "200":
          description: Connecting, with the code to enter.
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemoryBackup" }
              example:
                state: connecting
                code: WDJB-MJHT
                url: https://github.com/login/device
                expires_at: "2026-11-01T09:15:00.000Z"
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/TokenRejected" }
        "503": { $ref: "#/components/responses/Unavailable" }
    delete:
      tags: [Memory]
      operationId: stopMemoryBackup
      summary: Stop backing memory up to GitHub
      description: |
        *Disconnect*: the server forgets its GitHub tokens and stops pushing. The repository and
        everything in it stay on GitHub, and memory stays on the server. A backup set with
        `ito memory remote` is left as it is.
      responses:
        "200":
          description: How memory is backed up now.
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemoryBackup" }
              example: { state: "off" }
        "401": { $ref: "#/components/responses/TokenRejected" }
  /v0/motion:
    get:
      tags: [Motion]
      operationId: listMotion
      summary: Everything in motion, then what's done
      description: |
        Active things first, then done ones, each group newest first. Done ones carry their
        `outcome`; those that never show (`duplicate`, `test`, `elsewhere`) are listed too, so
        nothing is lost, for apps to leave out.
      responses:
        "200":
          description: The things.
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MotionList" }
        "401": { $ref: "#/components/responses/TokenRejected" }
  /v0/motion/{motion}:
    get:
      tags: [Motion]
      operationId: getMotion
      summary: One thing, with its content, state and what changed
      description: |
        The content is as its kind in [the motion schema](motion.schema.json) describes. With
        `version`, the content is as it was then, to read only; the state and changes always
        belong to the latest.
      parameters:
        - $ref: "#/components/parameters/Motion"
        - name: version
          in: query
          required: false
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: The thing.
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MotionDetail" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/TokenRejected" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v0/motion/{motion}/state:
    patch:
      tags: [Motion]
      operationId: patchMotionState
      summary: Tick items in a thing, or choose for its places
      description: |
        A JSON Merge Patch (RFC 7386) on the state, keyed by item ids, such as
        `{"todo": {"book-uffizi": {"done": true}}}` or
        `{"places": {"pitti-place": {"status": "picked"}}}`, sent as `application/merge-patch+json`
        or `application/json`; `null` takes a tick or a choice back. Its kind in
        [the motion schema](motion.schema.json) says which keys the state has. Every app hears
        `motion.state`. A few seconds later, gathering taps made in quick succession, Ari keeps the
        thing up with them, such as marking what a to-do books as booked, fitting a place you put
        in the plan into a day or writing the week's line: that's an ordinary `motion.changed`, with
        no chat message. Ari also hears of them with your next message. Sending the same patch twice
        changes nothing.
      parameters:
        - $ref: "#/components/parameters/Motion"
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { type: object, additionalProperties: true }
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200":
          description: The whole state, after the patch.
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MotionState" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/TokenRejected" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v0/made:
    get:
      tags: [Made]
      operationId: listMade
      summary: The Made shelf
      description: Every page Ari made, most recently changed first.
      responses:
        "200":
          description: The pages.
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MadeList" }
        "401": { $ref: "#/components/responses/TokenRejected" }
  /v0/made/{made}:
    get:
      tags: [Made]
      operationId: getMade
      summary: One page, with its content, your ticks and what changed
      description: The content is as `MadeContent` in [the made schema](made.schema.json) describes.
      parameters:
        - $ref: "#/components/parameters/Made"
      responses:
        "200":
          description: The page.
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MadeDetail" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/TokenRejected" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v0/made/{made}/state:
    patch:
      tags: [Made]
      operationId: patchMadeState
      summary: Tick items on a page, or take a tick back
      description: |
        A JSON Merge Patch (RFC 7386) on the state, such as
        `{"ticks": {"trajans-column": "2026-11-22T14:32:00.000Z"}}` with when you ticked it, sent as
        `application/merge-patch+json` or `application/json`; `null` takes a tick back. Only a page
        with a `check` word ticks, and only its items. Every app hears `made.state`, and Ari reads
        the ticks with the page. Sending the same patch twice changes nothing.
      parameters:
        - $ref: "#/components/parameters/Made"
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { type: object, additionalProperties: true }
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200":
          description: The whole state, after the patch.
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MadeStateResult" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/TokenRejected" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v0/models:
    get:
      tags: [Model]
      operationId: listModels
      summary: The models the agent can run on
      description: |
        Every model the agent's engine offers, with how hard each can think, and the current choice.
        Until one is chosen, `chosen` is the engine's default model at its default effort. A chosen
        model the engine no longer offers stays chosen, but is missing from `models`.
      responses:
        "200":
          description: The models and the choice.
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelList" }
        "401": { $ref: "#/components/responses/TokenRejected" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v0/agent:
    put:
      tags: [Model]
      operationId: chooseModel
      summary: Choose the agent's model
      description: |
        One choice for the whole server, kept across restarts. It applies from the next message;
        a turn already running finishes on the model it started with.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ModelChoice" }
            example: { model: gpt-6-luna, effort: medium }
      responses:
        "200":
          description: The choice, as saved.
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelChoice" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/TokenRejected" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v0/access:
    get:
      tags: [Access]
      operationId: getAccess
      summary: Read how Kumo runs on the server
      description: |
        Whether Kumo runs in its sandbox, as it does unless you change it, or with full access, and
        since when. `access.changed` carries every change, and the snapshot holds it while it's full.
      responses:
        "200":
          description: How Kumo runs.
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
          content:
            application/json:
              schema: { $ref: "events.schema.json#/$defs/Access" }
              example: { mode: sandboxed }
        "401": { $ref: "#/components/responses/TokenRejected" }
  /v0/access/full:
    post:
      tags: [Access]
      operationId: giveFullAccess
      summary: Give Kumo full access to the server
      description: |
        From the next turn or piece of work that starts, in the chat, in the background and in the
        night's dream, Kumo runs without Codex's sandbox: its commands can install, restart and
        change anything the server's user can, Ito's own checkout included, with nothing asked
        first. A turn already running keeps the sandbox it started with. Nothing else turns it on:
        the body must say `confirm: true`, so a stray call can't, and the app asks for Face ID
        before it sends it. Turning it on when it's already on changes nothing. Kumo's work notes
        each change, and every app hears `access.changed`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FullAccessConsent" }
            example: { confirm: true }
      responses:
        "200":
          description: Full access is on.
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
          content:
            application/json:
              schema: { $ref: "events.schema.json#/$defs/Access" }
              example: { mode: full, since: "2026-11-27T14:02:00.000Z" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/TokenRejected" }
    delete:
      tags: [Access]
      operationId: endFullAccess
      summary: Put Kumo back in its sandbox
      description: |
        From the next turn or piece of work that starts, Kumo runs in its sandbox again: free to
        write in its workspace and reach the network, and to read the rest of the server. Safe to
        repeat. Kumo's work notes the change, and every app hears `access.changed`.
      responses:
        "200":
          description: Kumo runs in its sandbox.
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
          content:
            application/json:
              schema: { $ref: "events.schema.json#/$defs/Access" }
              example: { mode: sandboxed }
        "401": { $ref: "#/components/responses/TokenRejected" }
  /v0/calls/{call}:
    put:
      tags: [Talk]
      operationId: startCall
      summary: Start a call
      description: |
        Starts a call under the id the app chose, so starting it again is safe. While it's on, the
        agent speaks: short replies, no lists, the details in the chat, and notes as spoken lines.
        Starting a call while another is on ends the earlier one first.
      parameters:
        - $ref: "#/components/parameters/Call"
      responses:
        "201":
          description: The call started.
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CallResult" }
        "200":
          description: It had already started; nothing changed.
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CallResult" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/TokenRejected" }
  /v0/calls/{call}/end:
    post:
      tags: [Talk]
      operationId: endCall
      summary: End a call
      description: Ends the call, with its length. Ending one that has already ended changes nothing.
      parameters:
        - $ref: "#/components/parameters/Call"
      responses:
        "200":
          description: The call, as it ended.
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CallResult" }
        "401": { $ref: "#/components/responses/TokenRejected" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v0/calls/{call}/audio:
    delete:
      tags: [Talk]
      operationId: deleteCallAudio
      summary: Delete a call's audio
      description: Deletes the recordings of the call's spoken messages; their text stays. Deleting it again changes nothing.
      parameters:
        - $ref: "#/components/parameters/Call"
      responses:
        "200":
          description: The call, with its audio deleted.
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CallResult" }
        "401": { $ref: "#/components/responses/TokenRejected" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v0/calls/{call}/stream:
    get:
      tags: [Talk]
      operationId: streamCall
      summary: Stream a call
      description: |
        Upgrades to a WebSocket once the call is on (`PUT /v0/calls/{call}`), with the token in
        `Authorization` as everywhere. One stream per call: a second connection replaces the first,
        which closes with code 4000.

        - **Binary frames up:** your microphone, 16-bit little-endian PCM, mono, 16 kHz, in frames
          of 20 to 40 ms. Send continuously while unmuted, silence included: turn-taking times it.
        - **Binary frames down:** Ari's voice, 16-bit little-endian PCM, mono, 24 kHz. Play them in
          order; each follows the `saying` frame that names its sentence.
        - **Text frames** both ways are JSON, as in
          [the stream schema](stream.schema.json): `mute`, `unmute`, `end` and `played` from the
          app; `state`, `heard`, `saying`, `stop_playback` and `problem` from the server.

        The server posts each of your turns as a spoken message itself, with its recording and the
        words it corrected, so the conversation events are as for any message. If the socket
        drops, the call stays on for 20 seconds and reconnecting carries on; past that the call
        ends with `end_reason` "The connection dropped." A `problem` frame ends the call with its
        reason, and the server closes the socket.
      parameters:
        - $ref: "#/components/parameters/Call"
      responses:
        "101":
          description: Switching to the WebSocket.
        "401": { $ref: "#/components/responses/TokenRejected" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v0/speech:
    post:
      tags: [Talk]
      operationId: speak
      summary: Say something in Ari's voice
      description: |
        Says the text in Ari's voice and answers with a WAV: 24 kHz, mono, 16-bit PCM. Settings uses it
        to preview voices, and a call uses it a sentence at a time, asking for the next while one plays,
        until the call stream carries Ari's voice. Left out, `voice` is the one chosen with
        `PUT /v0/voice`. While the voice isn't ready, the answer is `unavailable`, with `Retry-After`
        while it's loading and the reason in `detail`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SpeechRequest" }
            example: { text: "Hi, I'm Ari. This is how I sound.", voice: bf_emma }
      responses:
        "200":
          description: The speech.
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
          content:
            audio/wav:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/TokenRejected" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v0/voices:
    get:
      tags: [Talk]
      operationId: listVoices
      summary: Ari's voices, and whether the server can talk
      description: |
        Every voice, the one chosen, and the voice's state: offer Talk only while it's `ready`, and
        otherwise show the reason. `voice.status` events say when the state changes.
      responses:
        "200":
          description: The voices and the voice's state.
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VoiceList" }
        "401": { $ref: "#/components/responses/TokenRejected" }
  /v0/voice/voiceprint:
    delete:
      tags: [Talk]
      operationId: forgetVoiceprint
      summary: Relearn your voice
      description: |
        Forgets the voiceprint the server learnt from your calls, so it learns your voice again from
        the next two minutes of you speaking, starting with a call in progress.
      responses:
        "200":
          description: The voices, with `voiceprint` now `learning`.
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VoiceList" }
        "401": { $ref: "#/components/responses/TokenRejected" }
  /v0/voice:
    put:
      tags: [Talk]
      operationId: chooseVoice
      summary: Choose Ari's voice
      description: One choice for the whole server, kept across restarts. It applies from the next sentence Ari says.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VoiceChoice" }
            example: { voice: bf_emma }
      responses:
        "200":
          description: The choice, as saved.
          headers:
            Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VoiceChoice" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/TokenRejected" }
components:
  securitySchemes:
    token:
      type: http
      scheme: bearer
      bearerFormat: ito_…
      description: |
        The token `ito serve` printed when it created it; `ito token new` replaces it. Send it only
        over HTTPS (or to a loopback address during development). The server never logs it.
  headers:
    ItoProtocol:
      description: The protocol version this response speaks, as `MAJOR.MINOR`.
      schema:
        type: string
        pattern: ^\d+\.\d+$
        example: "0.13"
    RetryAfter:
      description: Seconds to wait before trying again.
      schema:
        type: integer
        minimum: 0
  parameters:
    CalendarItem:
      name: item
      in: path
      required: true
      description: The item's id, from its `CalendarItem` in Coming up.
      schema: { $ref: "events.schema.json#/$defs/CalendarItemId" }
    Made:
      name: made
      in: path
      required: true
      description: The page's id, from its `Made`.
      schema: { $ref: "events.schema.json#/$defs/MadeId" }
    Motion:
      name: motion
      in: path
      required: true
      description: The thing's id, from its `Motion`.
      schema: { $ref: "events.schema.json#/$defs/MotionId" }
    Thread:
      name: thread
      in: path
      required: true
      description: The thread's id, from its `Thread`.
      schema: { $ref: "events.schema.json#/$defs/ThreadId" }
    Message:
      name: message
      in: path
      required: true
      description: The message's id.
      schema: { $ref: "events.schema.json#/$defs/MessageId" }
    Turn:
      name: turn
      in: path
      required: true
      description: The turn's id, from `turn.started`.
      schema: { $ref: "events.schema.json#/$defs/TurnId" }
    Upload:
      name: attachment
      in: path
      required: true
      description: The id the app made for what it's uploading.
      schema: { $ref: "events.schema.json#/$defs/UploadId" }
    File:
      name: file
      in: path
      required: true
      description: The file's id, from an `ari:file` block.
      schema: { $ref: "events.schema.json#/$defs/FileId" }
    BigUpload:
      name: upload
      in: path
      required: true
      description: The id the app made for the big upload, which becomes its attachment's id.
      schema: { $ref: "events.schema.json#/$defs/UploadId" }
    Attachment:
      name: attachment
      in: path
      required: true
      description: The attachment's id, from its message.
      schema: { $ref: "events.schema.json#/$defs/AttachmentId" }
    Ask:
      name: ask
      in: path
      required: true
      description: The ask's id, from `ask.started`.
      schema: { $ref: "events.schema.json#/$defs/AskId" }
    Device:
      name: device
      in: path
      required: true
      description: A random UUID the app makes once per install, and keeps.
      schema:
        type: string
        format: uuid
    WakeUp:
      name: wake_up
      in: path
      required: true
      schema: { $ref: "events.schema.json#/$defs/WakeUpId" }
    Dream:
      name: dream
      in: path
      required: true
      description: The dream's id, from its `Dream`.
      schema: { $ref: "events.schema.json#/$defs/DreamId" }
    Call:
      name: call
      in: path
      required: true
      description: The id the app chose when it started the call.
      schema: { $ref: "events.schema.json#/$defs/CallId" }
    Capability:
      name: capability
      in: path
      required: true
      description: The capability's id, such as `reports`.
      schema: { $ref: "#/components/schemas/CapabilityId" }
  responses:
    InvalidRequest:
      description: The request is malformed, or not possible in the current state (`invalid_request`).
      headers:
        Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResult" }
          example:
            error:
              code: invalid_request
              message: Only a reply that failed can be tried again.
              detail: Turn t_0007 ended with outcome completed.
    TokenRejected:
      description: The token is missing, malformed, unknown or replaced (`token_rejected`).
      headers:
        Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResult" }
          example:
            error:
              code: token_rejected
              message: The server didn't accept this token.
              detail: Use the token ito serve printed, or run ito token new.
    PairingCodeRejected:
      description: The pairing code is wrong, already used or expired (`pairing_code_rejected`).
      headers:
        Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResult" }
          example:
            error:
              code: pairing_code_rejected
              message: That pairing code has expired or was already used.
              detail: Run ito pair on the server for a new code.
    NotFound:
      description: The server doesn't know this turn, message, ask, attachment or device (`not_found`).
      headers:
        Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResult" }
    IdConflict:
      description: A message or attachment with this id was already accepted with different content (`id_conflict`).
      headers:
        Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResult" }
    TooLarge:
      description: The message or attachment is larger than the server accepts (`too_large`).
      headers:
        Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResult" }
    UnsupportedType:
      description: |
        The server doesn't take this media type in a big upload, or the file's first bytes don't fit
        the type it was given (`unsupported_type`). The message names what it takes.
      headers:
        Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResult" }
          example:
            error:
              code: unsupported_type
              message: "Ito takes recordings as M4A, MP3, WAV, AAC, Ogg/Opus, FLAC, WebM, AMR, Core Audio or AIFF."
              detail: video/quicktime isn't a media type big uploads take.
    NotTranscribed:
      description: The recording has no transcript yet, or any more (`not_transcribed`); `recording` says where it stands.
      headers:
        Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/RecordingErrorResult" }
    ServerDiskFull:
      description: The server's disk hasn't room for the file (`server_disk_full`).
      headers:
        Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResult" }
    OffsetMismatch:
      description: |
        The chunk starts past what the server has (`offset_mismatch`). Send again from the upload's
        `received`.
      headers:
        Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/UploadErrorResult" }
    UploadIncomplete:
      description: |
        The server hasn't every byte yet (`upload_incomplete`). Send the rest from the upload's
        `received`, then finish again.
      headers:
        Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/UploadErrorResult" }
    ChecksumMismatch:
      description: |
        The bytes that arrived don't have the SHA-256 the app gave (`checksum_mismatch`). The server
        has started the upload over: send it again from offset 0.
      headers:
        Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/UploadErrorResult" }
    SlowDown:
      description: Too many requests, or too many wrong tokens (`slow_down`).
      headers:
        Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
        Retry-After: { $ref: "#/components/headers/RetryAfter" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResult" }
    Unavailable:
      description: The server is starting or shutting down (`unavailable`).
      headers:
        Ito-Protocol: { $ref: "#/components/headers/ItoProtocol" }
        Retry-After: { $ref: "#/components/headers/RetryAfter" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResult" }
  schemas:
    BrowserBody:
      type: object
      required: [browser]
      properties:
        browser: { $ref: "events.schema.json#/$defs/Browser" }
    SpeechRequest:
      type: object
      required: [text]
      properties:
        text:
          description: What to say, as it should be spoken.
          type: string
          minLength: 1
          maxLength: 500
        voice:
          description: "A voice's id from `GET /v0/voices`. Left out, the chosen voice speaks."
          type: string
    VoiceList:
      type: object
      required: [voices, chosen, state, voiceprint]
      properties:
        voices:
          type: array
          items: { $ref: "#/components/schemas/Voice" }
        chosen:
          description: The id of the voice Ari speaks in.
          type: string
        state: { $ref: "events.schema.json#/$defs/VoiceState" }
        reason: { $ref: "events.schema.json#/$defs/VoiceReason" }
        voiceprint: { $ref: "#/components/schemas/VoiceprintState" }
    VoiceprintState:
      description: |
        `learnt` once the server knows your voice from your calls, so only a voice like yours holds a
        turn open; `learning` until it has heard enough of you, about two minutes of a call.
      enum: [learning, learnt]
    VoiceChoice:
      type: object
      required: [voice]
      properties:
        voice: { description: "A voice's id from `GET /v0/voices`.", type: string, minLength: 1 }
    Voice:
      type: object
      required: [id, name, accent]
      properties:
        id: { description: "Such as `af_heart`.", type: string }
        name: { description: "Such as Heart.", type: string }
        accent: { enum: [american, british] }
    CallResult:
      type: object
      required: [call]
      properties:
        call: { $ref: "events.schema.json#/$defs/Call" }
    FullAccessConsent:
      type: object
      required: [confirm]
      additionalProperties: false
      properties:
        confirm:
          description: You mean it, having confirmed it on the phone, such as with Face ID.
          const: true
    ModelChoice:
      type: object
      required: [model, effort]
      properties:
        model: { description: The model's id., type: string, minLength: 1 }
        effort: { description: "One of the model's efforts, such as `medium`.", type: string, minLength: 1 }
    ModelList:
      type: object
      required: [models, chosen]
      properties:
        models:
          type: array
          items: { $ref: "#/components/schemas/ModelOption" }
        chosen: { $ref: "#/components/schemas/ModelChoice" }
    ModelOption:
      description: A model the engine offers.
      type: object
      required: [id, title, summary, efforts, default_effort, is_default, images]
      properties:
        id: { description: What to send as `model` to choose it., type: string }
        title:
          description: Its name, such as GPT-6.1-Sol.
          type: string
        summary:
          description: One line on what it's for, in the engine's words.
          type: string
        efforts:
          description: How hard it can think, lightest first, each with the engine's own line about it.
          type: array
          items:
            type: object
            required: [id, summary]
            properties:
              id: { description: "Such as `low`, `medium`, `high` or `xhigh`.", type: string }
              summary: { type: string }
        default_effort: { description: The effort it runs at unless one is chosen., type: string }
        is_default: { description: True for the engine's default model., type: boolean }
        images: { description: Whether it can see photos you attach., type: boolean }
    Shelf:
      description: A shelf in memory; `people` holds one page per person, `groups` one per group of people, `chapters` one per chapter of your life, and `journal` one per day.
      enum: [people, groups, goals, projects, places, topics, chapters, journal]
    Gist:
      description: |
        What the page is now, in one line, written by Ari and kept current with every change: a
        journal day's headline, who someone is to you, where a project stands. Absent until Ari
        has written one; Ari writes one for every page that lacks it, soon after the server starts.
      type: string
    Circle:
      description: |
        People pages only: who they are to you, in Ari's own words, such as `family`, `friends` or
        `work`. Ari keeps it current and reuses the same words across people, so the app can group
        people by it. Absent until Ari has given one.
      type: string
    MemoryPageSummary:
      type: object
      required: [address, title, changed_at]
      properties:
        address: { $ref: "events.schema.json#/$defs/MemoryAddress" }
        title: { type: string }
        gist: { $ref: "#/components/schemas/Gist" }
        circle: { $ref: "#/components/schemas/Circle" }
        changed_at: { $ref: "events.schema.json#/$defs/Timestamp" }
    MemoryLink:
      description: A page this one links to, as it is now.
      type: object
      required: [address, title, aliases]
      properties:
        address: { $ref: "events.schema.json#/$defs/MemoryAddress" }
        title: { type: string }
        aliases:
          description: Other names Ari knows it by, for finding mentions of it in the page.
          type: array
          items: { type: string }
    MemoryPage:
      type: object
      required: [address, title, shelf, aliases, links, changed_at, markdown]
      properties:
        address: { $ref: "events.schema.json#/$defs/MemoryAddress" }
        title: { type: string }
        gist: { $ref: "#/components/schemas/Gist" }
        circle: { $ref: "#/components/schemas/Circle" }
        shelf:
          description: Its shelf, or `portrait`, `now` or `helping-you` for the pages in mind.
          enum: [portrait, now, helping-you, people, groups, goals, projects, places, topics, chapters, journal]
        aliases:
          description: Other names Ari knows it by.
          type: array
          items: { type: string }
        links:
          description: The related pages that exist, in Ari's order.
          type: array
          items: { $ref: "#/components/schemas/MemoryLink" }
        changed_at: { $ref: "events.schema.json#/$defs/Timestamp" }
        markdown:
          description: The page as Ari wrote it, without front matter.
          type: string
        photos:
          description: |
            The photos the page shows from memory, in the order the Markdown first shows them.
            Absent when it shows none. A Markdown image whose source isn't here isn't in memory:
            show its words instead.
          type: array
          items: { $ref: "#/components/schemas/MemoryPhoto" }
        chapter: { $ref: "#/components/schemas/ChapterFacts" }
    MemoryPhoto:
      description: A photo a page keeps with its story.
      type: object
      required: [source, name]
      properties:
        source:
          description: The image's source as the page's Markdown has it, such as `../media/3f9a1c2b4d5e6f70.jpg`.
          type: string
        name: { $ref: "#/components/schemas/MediaName" }
        width:
          description: Its width in pixels, when its header gives it.
          type: integer
          minimum: 1
        height:
          description: Its height in pixels, when its header gives it.
          type: integer
          minimum: 1
    MediaName:
      description: A photo's name in memory, to fetch with `getMemoryMedia`.
      type: string
      maxLength: 128
      pattern: "^[A-Za-z0-9_-][A-Za-z0-9_.-]*\\.(jpg|jpeg|png|gif|webp|JPG|JPEG|PNG|GIF|WEBP)$"
    MemoryPages:
      type: object
      required: [pages]
      properties:
        pages:
          type: array
          items: { $ref: "#/components/schemas/MemoryPage" }
    PageList:
      type: object
      required: [pages]
      properties:
        pages:
          type: array
          items: { $ref: "#/components/schemas/MemoryPageSummary" }
    RecentChange:
      type: object
      required: [change, address, title, at]
      properties:
        change: { $ref: "events.schema.json#/$defs/ChangeId" }
        address: { $ref: "events.schema.json#/$defs/MemoryAddress" }
        title:
          description: The page's title when it changed.
          type: string
        at: { $ref: "events.schema.json#/$defs/Timestamp" }
        note:
          description: |
            What the change did, in a few words, such as "Florence together 6–9 Nov". Absent for
            pages that came from outside with `ito memory pull`, and for changes made before 0.11.
          type: string
    RecentChanges:
      type: object
      required: [changes]
      properties:
        changes:
          type: array
          items: { $ref: "#/components/schemas/RecentChange" }
    Day:
      description: A day, as YYYY-MM-DD, where you are.
      type: string
      format: date
    Chapter:
      description: A chapter in the Library's row.
      type: object
      required: [address, title, began, changed_at]
      properties:
        address: { $ref: "events.schema.json#/$defs/MemoryAddress" }
        title:
          description: Its name, such as "Florence with Mira".
          type: string
        gist: { $ref: "#/components/schemas/Gist" }
        began: { $ref: "#/components/schemas/Day" }
        ended:
          description: The day it ended. Absent while it's still going.
          $ref: "#/components/schemas/Day"
        cover:
          description: The first photo its story shows. Absent when it shows none.
          $ref: "#/components/schemas/MemoryPhoto"
        changed_at: { $ref: "events.schema.json#/$defs/Timestamp" }
    ChapterList:
      type: object
      required: [chapters]
      properties:
        chapters:
          type: array
          items: { $ref: "#/components/schemas/Chapter" }
    ChapterFacts:
      description: |
        A chapter's page only: when it began and ended, when Ari noticed it, and what it drew on,
        counted by the server rather than said by Ari. The story and *What changed* are its Markdown.
      type: object
      required: [began, drawn_from]
      properties:
        began: { $ref: "#/components/schemas/Day" }
        ended:
          description: The day it ended. Absent while it's still going.
          $ref: "#/components/schemas/Day"
        noticed:
          description: The day Ari first wrote it. Absent for a chapter that came from outside.
          $ref: "#/components/schemas/Day"
        drawn_from:
          type: object
          required: [journal_days, photos]
          properties:
            journal_days:
              description: The journal days it links to.
              type: integer
              minimum: 0
            photos:
              description: The photos in memory that it and those days show.
              type: integer
              minimum: 0
    LearntLine:
      type: object
      required: [text, at, address, change]
      properties:
        text:
          description: What Ari learnt, in a line to you.
          type: string
        at: { $ref: "events.schema.json#/$defs/Timestamp" }
        address:
          description: The page whose change taught it.
          $ref: "events.schema.json#/$defs/MemoryAddress"
        change: { $ref: "events.schema.json#/$defs/ChangeId" }
    LearntLines:
      type: object
      required: [lines]
      properties:
        lines:
          type: array
          items: { $ref: "#/components/schemas/LearntLine" }
    ShelfList:
      type: object
      required: [shelves]
      properties:
        shelves:
          type: array
          items:
            type: object
            required: [shelf, count]
            properties:
              shelf: { $ref: "#/components/schemas/Shelf" }
              count: { type: integer, minimum: 0 }
    MemoryChange:
      type: object
      required: [change, address, title, at]
      properties:
        change: { $ref: "events.schema.json#/$defs/ChangeId" }
        address: { $ref: "events.schema.json#/$defs/MemoryAddress" }
        title: { type: string }
        at: { $ref: "events.schema.json#/$defs/Timestamp" }
        before:
          description: The page's Markdown before the change. Absent for a new page.
          type: string
        after:
          description: The page's Markdown after the change. Absent when Ari deleted it.
          type: string
    MemoryBackup:
      description: Where memory is backed up off the server, and how that's going.
      type: object
      required: [state]
      properties:
        state:
          description: |
            - `off`: memory is only on the server.
            - `connecting`: waiting for you to enter `code` at `url`, before `expires_at`.
            - `installing`: GitHub is connected, and the server waits for Ito Memory to be installed
              on `repository`: open `install_url`. It notices by itself.
            - `on`: memory is pushed after each change to `repository`, through Ito Memory, or to
              `remote`, set on the server with `ito memory remote`.
            - `stopped`: backing up needs you: `problem` says why, and `GET /v0/problems` says how to
              fix it. Connecting again starts over.
          enum: [off, connecting, installing, on, stopped]
        code:
          description: "`connecting`: the code to enter, to show as it is."
          type: string
        url:
          description: "`connecting`: GitHub's page to enter it on."
          type: string
          format: uri
        expires_at:
          $ref: "events.schema.json#/$defs/Timestamp"
          description: "`connecting`: when the code stops working."
        repository:
          description: The GitHub repository memory goes to, as `owner/name`.
          type: string
          examples: [octo-person/ito-thread]
        repository_url:
          description: Its page on GitHub.
          type: string
          format: uri
        created:
          description: The server made the repository, private, when it found none.
          type: boolean
        install_url:
          description: "`installing`: where to install Ito Memory, or, once it's installed, to add the repository to it."
          type: string
          format: uri
        repository_chosen:
          description: "`installing`: true when GitHub's page opens with the repository already chosen; otherwise choose just that one there."
          type: boolean
        new_repository_url:
          description: |
            `installing`: there may be no `ito-thread` yet, and GitHub lets the server make one
            only once the app is installed. Make it here first, private, then install.
          type: string
          format: uri
        remote:
          description: "Where `ito memory remote` points, without any password in it, when that's how memory is backed up."
          type: string
        pushed_at:
          $ref: "events.schema.json#/$defs/Timestamp"
          description: When memory last reached the backup.
        problem:
          description: "`stopped`: what's wrong, in a sentence. `off`: why connecting didn't finish, such as a code that expired."
          type: string
    CapabilityId:
      description: Lowercase letters, digits and dashes, such as `reports`.
      type: string
      pattern: ^[a-z][a-z0-9-]{0,31}$
    CapabilityList:
      type: object
      required: [capabilities]
      properties:
        capabilities:
          type: array
          items: { $ref: "#/components/schemas/Capability" }
    Capability:
      description: A capability, as Settings shows it.
      type: object
      required: [id, kind, title, summary, version, state, fields, uses]
      properties:
        id: { $ref: "#/components/schemas/CapabilityId" }
        kind:
          description: "`domain` for a topic of your life, `hand` for a way Kumo acts, `source` for an account Kumo reads, such as iCloud for mail and calendar."
          enum: [domain, hand, source]
        title:
          description: Its name, such as Reports.
          type: string
        summary:
          description: One sentence on what it does.
          type: string
        symbol:
          description: An SF Symbol name to show beside it. Absent when it names none; show a default.
          type: string
        version:
          description: The capability's own version, as `MAJOR.MINOR`.
          type: string
          pattern: ^\d+\.\d+$
        state:
          description: |
            `off` until you switch it on; `setup` while it's on but its setup isn't complete; `on` when
            it's working; `needs_you` when it's on but isn't working, with `detail` saying why.
          enum: [off, setup, on, needs_you]
        detail:
          description: "`needs_you` only: what's wrong, in plain words, such as GitHub rejected the token."
          type: string
        fields:
          description: Its setup sheet's fields, in order.
          type: array
          items: { $ref: "#/components/schemas/CapabilityField" }
        uses:
          description: What it reaches beyond its own folder, to show before you switch it on.
          type: object
          required: [hosts, folders]
          properties:
            hosts: { type: array, items: { type: string } }
            folders: { type: array, items: { type: string } }
      example:
        id: reports
        kind: hand
        title: Reports
        summary: Takes your feedback, and what Ari couldn't do, to Ito's developers as public GitHub issues.
        symbol: exclamationmark.bubble
        version: "0.2"
        state: needs_you
        detail: GitHub rejected the token.
        fields:
          - name: token
            kind: secret
            title: GitHub token
            description: Connect GitHub, so Reports files issues on akai-ito/ito-core as you.
            set: true
        uses: { hosts: [api.github.com, github.com], folders: [uploads] }
    CapabilityField:
      description: |
        One field of a setup sheet. A `secret` never comes back: `set` says whether one is saved.
        Every other field carries its saved `value`, if any.
      type: object
      required: [name, kind, title]
      properties:
        name:
          type: string
          pattern: ^[a-z][a-z0-9_]*$
        kind: { enum: [text, secret, toggle, choice] }
        title: { type: string }
        description: { type: string }
        placeholder:
          description: What to show in the empty field, such as you@icloud.com.
          type: string
        optional:
          description: True when the capability can run without it.
          type: boolean
        options:
          description: "`choice` only: what can be picked."
          type: array
          items:
            type: object
            required: [value, label]
            properties:
              value: { type: string }
              label: { type: string }
        value:
          description: "The saved value: a string, or a boolean for `toggle`. Never present for a `secret`."
          anyOf: [{ type: string }, { type: boolean }]
        set:
          description: "`secret` only: whether one is saved."
          type: boolean
        connect:
          description: |
            How to fill it without typing it in. `oauth_device`: start with
            `POST /v0/capabilities/{capability}/connect`, which gives a code to approve at the
            provider. `link`: open `url`, where the provider makes one, and paste it here.
          type: object
          required: [kind, title]
          properties:
            kind: { enum: [oauth_device, link] }
            title:
              description: What the button says, such as Connect GitHub.
              type: string
            url:
              description: "`link` only: the page that makes one, filled in where the provider allows it."
              type: string
              format: uri
    CapabilityConnection:
      type: object
      required: [code, url, expires_at]
      properties:
        code:
          description: The code to approve at the provider, to show as it is.
          type: string
        url:
          description: The provider's page to approve it on.
          type: string
          format: uri
        expires_at:
          $ref: "events.schema.json#/$defs/Timestamp"
          description: When the code stops working.
    SwitchCapability:
      type: object
      required: [on]
      properties:
        on: { type: boolean }
    CapabilitySetup:
      type: object
      required: [values]
      properties:
        values:
          description: Values by field name; a string, or a boolean for `toggle`.
          type: object
          additionalProperties:
            anyOf: [{ type: string }, { type: boolean }]
    CheckResult:
      type: object
      properties:
        problem:
          description: What's wrong with the values, in plain words. Absent when they work.
          type: string
        summary:
          description: 'When they work, what connected, such as "Connected: 2 addresses, 4 calendars. Kumo''s calendar added."'
          type: string
    Event:
      description: One event on the stream; the `type` field says which.
      $ref: "events.schema.json#/$defs/Event"
    Snapshot:
      $ref: "events.schema.json#/$defs/Snapshot"
    MessageAccepted:
      $ref: "events.schema.json#/$defs/MessageAccepted"
    MessageQueued:
      $ref: "events.schema.json#/$defs/MessageQueued"
    MessageRead:
      $ref: "events.schema.json#/$defs/MessageRead"
    TurnStarted:
      $ref: "events.schema.json#/$defs/TurnStarted"
    TurnStatus:
      $ref: "events.schema.json#/$defs/TurnStatus"
    StepStarted:
      $ref: "events.schema.json#/$defs/StepStarted"
    StepUpdated:
      $ref: "events.schema.json#/$defs/StepUpdated"
    StepEnded:
      $ref: "events.schema.json#/$defs/StepEnded"
    MessageStarted:
      $ref: "events.schema.json#/$defs/MessageStarted"
    MessageDelta:
      $ref: "events.schema.json#/$defs/MessageDelta"
    MessageEnded:
      $ref: "events.schema.json#/$defs/MessageEnded"
    TurnEnded:
      $ref: "events.schema.json#/$defs/TurnEnded"
    AskStarted:
      $ref: "events.schema.json#/$defs/AskStarted"
    AskEnded:
      $ref: "events.schema.json#/$defs/AskEnded"
    Ask:
      $ref: "events.schema.json#/$defs/Ask"
    Attachment:
      $ref: "events.schema.json#/$defs/Attachment"
    Notification:
      $ref: "push.schema.json#/$defs/Notification"
    Message:
      $ref: "events.schema.json#/$defs/Message"
    Step:
      $ref: "events.schema.json#/$defs/Step"
    Status:
      $ref: "events.schema.json#/$defs/Status"
    Error:
      $ref: "events.schema.json#/$defs/Error"
    Discovery:
      type: object
      required: [product, protocol]
      properties:
        product:
          const: ito
        protocol:
          description: The protocol versions this server speaks, as `MAJOR.MINOR`.
          type: array
          minItems: 1
          items:
            type: string
            pattern: ^\d+\.\d+$
    BeliefAnswer:
      description: One of `answer` or `correction`.
      type: object
      additionalProperties: false
      minProperties: 1
      maxProperties: 1
      properties:
        answer: { const: "true" }
        correction: { type: string, minLength: 1, maxLength: 4000 }
    DonePage:
      type: object
      required: [entries, has_more]
      properties:
        entries: { type: array, items: { $ref: "events.schema.json#/$defs/DoneEntry" } }
        has_more: { type: boolean }
    DoneResult:
      type: object
      required: [entry]
      properties:
        entry: { $ref: "events.schema.json#/$defs/DoneEntry" }
    DreamState:
      description: Kumo's dream as it stands.
      type: object
      required: [time, next_at]
      properties:
        time:
          description: When Kumo dreams each night, on your local clock, such as `04:00`.
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
        next_at:
          $ref: "events.schema.json#/$defs/Timestamp"
          description: When the next dream is due, in your time zone now.
        dreaming:
          description: A dream under way, while there is one.
          type: object
          required: [since, trigger, steps]
          properties:
            since: { $ref: "events.schema.json#/$defs/Timestamp" }
            trigger: { enum: [scheduled, manual] }
            steps:
              description: |
                Its latest steps, oldest first, up to 20, so an app that opens mid-dream catches up;
                `dream.progress` brings each one after.
              type: array
              items: { $ref: "events.schema.json#/$defs/DreamStep" }
        latest:
          $ref: "events.schema.json#/$defs/Dream"
          description: The latest dream, until there's been none.
    DreamTime:
      type: object
      required: [time]
      additionalProperties: false
      properties:
        time:
          description: Such as `04:00`, on your local clock.
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
    DreamResult:
      type: object
      required: [dream]
      properties:
        dream: { $ref: "events.schema.json#/$defs/Dream" }
    WakeUpList:
      type: object
      required: [wake_ups]
      properties:
        wake_ups: { type: array, items: { $ref: "events.schema.json#/$defs/WakeUp" } }
    WakeUpResult:
      type: object
      required: [wake_up]
      properties:
        wake_up: { $ref: "events.schema.json#/$defs/WakeUp" }
    WakeUpChange:
      description: What to change; leave out what stays.
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        at:
          $ref: "events.schema.json#/$defs/Timestamp"
          description: When it's next due; for a repeating one, only this time.
        repeat:
          description: How it comes back, or `null` for a one-off.
          oneOf:
            - $ref: "events.schema.json#/$defs/Repeat"
            - type: "null"
        title:
          description: Its title in Kumo's plans.
          type: string
          minLength: 1
          maxLength: 60
        what:
          type: string
          minLength: 1
          maxLength: 200
        why:
          type: string
          minLength: 1
          maxLength: 2000
    CardAnswer:
      $ref: "events.schema.json#/$defs/CardAnswer"
    CardResult:
      type: object
      required: [card]
      properties:
        card: { $ref: "events.schema.json#/$defs/Card" }
    GuessAnswer:
      description: |
        Your answer to one of Kumo's guesses at your day, one of: `right`; the `activity` it really
        was, from Not right?; or `text` for something else, which becomes its title.
      type: object
      additionalProperties: false
      minProperties: 1
      maxProperties: 1
      properties:
        right:
          description: The guess was right.
          const: true
        activity:
          $ref: "events.schema.json#/$defs/Activity"
        text:
          description: What it really was, in a few words, such as "Dentist, then errands".
          type: string
          minLength: 1
          maxLength: 60
    Work:
      description: Kumo's work for a day, today unless you asked for another, and the areas it's learning.
      type: object
      required: [day, handled, cleared, tracks]
      properties:
        day:
          description: The local day, such as `2026-11-05`.
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
        handled:
          description: What Kumo did without you that day, newest first.
          type: array
          items: { $ref: "events.schema.json#/$defs/DoneEntry" }
        cleared:
          description: The mail Kumo read and left alone that day (`quiet`), newest first.
          type: array
          items: { $ref: "events.schema.json#/$defs/DoneEntry" }
        tracks:
          description: Every area Kumo is learning, in the order it opened them, now. Draw each with its stage as bars.
          type: array
          items: { $ref: "events.schema.json#/$defs/Track" }
    Understanding:
      description: Understanding you, now.
      type: object
      required: [tracks, questions, recent]
      properties:
        tracks:
          description: Every area Kumo is learning, in the order it opened them, as in `GET /v0/work`.
          type: array
          items: { $ref: "events.schema.json#/$defs/Track" }
        questions:
          description: |
            The open questions, each naming its track: first those you haven't set aside, oldest
            first, then those you said "Not now" to.
          type: array
          items: { $ref: "events.schema.json#/$defs/Question" }
        recent:
          description: The questions answered or settled in the last 14 days, newest first.
          type: array
          items: { $ref: "events.schema.json#/$defs/Question" }
    QuestionReply:
      description: |
        Your answer to a question: `picked` options, your words as `text` or as a recording in
        `audio` (one or the other), and `none_fit` or `not_sure`. Send at least one; `none_fit`
        doesn't go with `picked`.
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        picked:
          description: The options you tapped, from the question's own.
          type: array
          minItems: 1
          maxItems: 6
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 80 }
        text:
          description: Your own words.
          type: string
          minLength: 1
          maxLength: 4000
        audio:
          $ref: "events.schema.json#/$defs/AttachmentId"
          description: A spoken answer, as the id of an audio file you uploaded with `PUT /v0/uploads/{upload}`.
        none_fit:
          description: None of the options fit.
          type: boolean
        not_sure:
          description: You're not sure.
          type: boolean
    QuestionResult:
      type: object
      required: [question]
      properties:
        question: { $ref: "events.schema.json#/$defs/Question" }
    CorrectDone:
      description: What was wrong, in your words; `{}` just says it was wrong.
      type: object
      additionalProperties: false
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 4000
    NewEvent:
      type: object
      required: [title, start, end]
      additionalProperties: false
      properties:
        title: { type: string, minLength: 1 }
        start: { $ref: "events.schema.json#/$defs/When" }
        end: { $ref: "events.schema.json#/$defs/When" }
        location: { type: string }
        notes: { type: string }
    EventMove:
      description: Where one of Kumo's blocks goes.
      type: object
      required: [start, end]
      additionalProperties: false
      properties:
        start: { $ref: "events.schema.json#/$defs/Timestamp" }
        end: { $ref: "events.schema.json#/$defs/Timestamp" }
    EventResult:
      type: object
      required: [event]
      properties:
        event: { $ref: "events.schema.json#/$defs/CalendarItem" }
    Lead:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          description: What the lead is called; Kumo until you choose another name.
          type: string
          minLength: 1
          maxLength: 40
          pattern: \S
    ServerInfo:
      type: object
      required: [name, version, protocol, lead, time_zone, agent, setup, capabilities]
      properties:
        name:
          description: The server's name, usually its host name.
          type: string
        version:
          description: The version of Ito the server runs.
          type: string
        protocol:
          description: The protocol version of this route, as `MAJOR.MINOR`.
          type: string
          pattern: ^\d+\.\d+$
        lead:
          $ref: "#/components/schemas/Lead"
        time_zone:
          description: The time zone Kumo lives by now, such as `Europe/London`. The latest a phone said, or the box's own.
          type: string
          minLength: 1
        whereabouts:
          description: What the box keeps of where you roughly are, once a phone has said. Show it in Settings.
          type: object
          required: [time_zone, as_of]
          properties:
            time_zone:
              type: string
              minLength: 1
            area:
              $ref: "#/components/schemas/Area"
            as_of:
              $ref: "events.schema.json#/$defs/Timestamp"
              description: When a phone last said.
        agent:
          description: The model Kumo runs on.
          type: object
          properties:
            model:
              description: |
                The model the agent runs on: the one chosen with `PUT /v0/agent`, or otherwise the one it
                last ran on, as its engine names it. Absent until either has happened.
              type: string
            effort:
              description: How hard it thinks on that model, as the engine names it, such as `low`.
              type: string
            account:
              description: How the agent's engine is signed in, as of its last run. Never the whole email address.
              type: object
              required: [kind]
              properties:
                kind:
                  description: "`chatgpt` for a ChatGPT sign-in, `api_key` for an API key, `other` for anything else."
                  enum: [chatgpt, api_key, other]
                plan:
                  description: "`chatgpt` only: the plan, such as `plus` or `pro`."
                  type: string
                email_domain:
                  description: "`chatgpt` only: the domain of the account's email, such as `gmail.com`."
                  type: string
        setup:
          description: What's set up on the server, so the app can say so in Settings rather than mid-conversation.
          type: object
          required: [notifications, memory_backup]
          properties:
            notifications:
              description: Whether the server can send push notifications (`ito push setup`).
              type: boolean
            memory_backup:
              description: |
                Whether memory is backed up: true once it has somewhere to go, through GitHub
                (`POST /v0/memory/backup`) or `ito memory remote`, and the last day's pushes went
                through.
              type: boolean
        capabilities:
          description: The capabilities that are on, with their versions, so the app knows which screens it can show.
          type: array
          items:
            type: object
            required: [id, version]
            properties:
              id: { $ref: "#/components/schemas/CapabilityId" }
              version:
                description: The capability's own version, as `MAJOR.MINOR`.
                type: string
                pattern: ^\d+\.\d+$
    SendMessage:
      type: object
      required: [id]
      anyOf:
        - required: [text]
          properties:
            text: { type: string, pattern: \S }
        - required: [attachments]
          properties:
            attachments: { type: array, minItems: 1 }
      properties:
        id:
          description: A random UUID the app makes when you tap Send. It is the message's id and its retry key.
          type: string
          format: uuid
        text:
          description: What you wrote, as plain text or Markdown. It may be empty, or left out, when the message carries attachments.
          type: string
          maxLength: 32000
        attachments:
          description: The photos and files to attach, uploaded first, in order, each once. Naming one the server doesn't have is an `attachment_missing`. Naming one another message already carries is an `invalid_request`.
          type: array
          maxItems: 10
          uniqueItems: true
          items: { $ref: "events.schema.json#/$defs/UploadId" }
        done:
          description: The Done entry this message replies to, such as a correction to one of Kumo's calls.
          $ref: "events.schema.json#/$defs/DoneId"
        thread:
          description: The thread to send it into. Left out, it goes to the main chat, unless `reply_to` names a message in a thread.
          $ref: "events.schema.json#/$defs/ThreadId"
        reply_to:
          description: The message you're replying to. In the main chat, the message goes into the thread under it, started now if there's none yet; in a thread, it's quoted there.
          $ref: "events.schema.json#/$defs/MessageId"
        new_thread:
          description: Start a new thread of your own with this message, as Threads' New thread does.
          const: true
    MessageResult:
      type: object
      required: [message]
      properties:
        message: { $ref: "events.schema.json#/$defs/Message" }
    MessagePage:
      type: object
      required: [messages, steps, asks, calls, threads, has_more]
      properties:
        messages:
          description: Oldest first.
          type: array
          items: { $ref: "events.schema.json#/$defs/Message" }
        steps:
          description: Every step from the first of these messages up to the message the page ends before, in position order.
          type: array
          items: { $ref: "events.schema.json#/$defs/Step" }
        asks:
          description: Every ask in the same span, in position order.
          type: array
          items: { $ref: "events.schema.json#/$defs/Ask" }
        calls:
          description: Every call that started in the same span, in position order.
          type: array
          items: { $ref: "events.schema.json#/$defs/Call" }
        threads:
          description: In the main chat, the threads whose lines sit among these messages, in position order. Empty in a thread.
          type: array
          items: { $ref: "events.schema.json#/$defs/Thread" }
        has_more:
          description: Whether even older messages exist.
          type: boolean
    ThreadList:
      type: object
      required: [open, threads, has_more]
      properties:
        open:
          description: Every open thread, latest first, or those that match the query.
          type: array
          items: { $ref: "events.schema.json#/$defs/Thread" }
        threads:
          description: Done threads, newest first by when they started, a page at a time.
          type: array
          items: { $ref: "events.schema.json#/$defs/Thread" }
        has_more:
          description: Whether older done threads exist.
          type: boolean
    ThreadPage:
      type: object
      required: [thread, messages, steps, asks, turn, next, has_more]
      properties:
        thread: { $ref: "events.schema.json#/$defs/Thread" }
        anchor:
          description: A thread you started by replying in the main chat has the message it replies to here, to show at its top.
          $ref: "events.schema.json#/$defs/Message"
        messages:
          description: The thread's latest messages, oldest first, including one still being written. Page further back with `GET /v0/messages`.
          type: array
          maxItems: 50
          items: { $ref: "events.schema.json#/$defs/Message" }
        steps:
          description: Every step in the thread from the first of these messages on, in position order.
          type: array
          items: { $ref: "events.schema.json#/$defs/Step" }
        asks:
          description: Every ask in the thread from the first of these messages on, in position order.
          type: array
          items: { $ref: "events.schema.json#/$defs/Ask" }
        turn:
          description: The thread's running turn, or null when it's idle.
          oneOf:
            - $ref: "events.schema.json#/$defs/LiveTurn"
            - type: "null"
        next:
          description: Messages waiting as Next in the thread.
          type: array
          items: { $ref: "events.schema.json#/$defs/MessageId" }
        has_more:
          description: Whether older messages exist in the thread.
          type: boolean
    SendShare:
      type: object
      required: [id]
      anyOf:
        - required: [url]
          properties:
            url: { type: string }
        - required: [text]
          properties:
            text: { type: string }
        - required: [note]
          properties:
            note: { type: string }
        - required: [attachments]
          properties:
            attachments: { type: array }
      properties:
        id:
          description: A random UUID the app makes for the share. It is the share's retry key, and the id of the message it becomes.
          type: string
          format: uuid
        url:
          description: The link you shared, `http` or `https`.
          type: string
          format: uri
          pattern: ^https?://
          maxLength: 2048
        text:
          description: Text you shared from another app, such as a passage you selected.
          type: string
          pattern: \S
          maxLength: 32000
        note:
          description: What you added in the share sheet, as plain text or Markdown. A quick thought can be a note alone.
          type: string
          pattern: \S
          maxLength: 32000
        attachments:
          description: The screenshots, photos and files you shared, uploaded first, in order, each once. Naming one the server doesn't have is an `attachment_missing`; naming one a message or another share already carries is an `invalid_request`.
          type: array
          minItems: 1
          maxItems: 10
          uniqueItems: true
          items: { $ref: "events.schema.json#/$defs/UploadId" }
    ShareResult:
      type: object
      required: [share]
      properties:
        share: { $ref: "#/components/schemas/Share" }
    Share:
      description: A share and where it stands.
      type: object
      required: [id, state, at]
      properties:
        id:
          description: The share's id, which its message takes once Kumo has placed it.
          $ref: "events.schema.json#/$defs/MessageId"
        state:
          description: "`sorting` while the server reads it and Kumo decides which thread it belongs in; `placed` once it's your message in that thread."
          type: string
          enum: [sorting, placed]
        at:
          description: When the server accepted it.
          $ref: "events.schema.json#/$defs/Timestamp"
        thread:
          description: Once it's placed, the thread it's in.
          $ref: "events.schema.json#/$defs/ThreadId"
    ThreadResult:
      type: object
      required: [thread]
      properties:
        thread: { $ref: "events.schema.json#/$defs/Thread" }
    ThreadChange:
      type: object
      minProperties: 1
      properties:
        title:
          description: Its new name, one to five words.
          type: string
          pattern: \S
          maxLength: 60
        state:
          description: Mark it `done`, or `open` again.
          enum: [open, done]
    MoveMessage:
      type: object
      properties:
        thread:
          description: The thread to move it into. Left out, it moves to the main chat.
          $ref: "events.schema.json#/$defs/ThreadId"

    MadeList:
      type: object
      required: [made]
      properties:
        made:
          type: array
          items: { $ref: "events.schema.json#/$defs/Made" }
    MadeDetail:
      type: object
      required: [made, content, state, changes]
      properties:
        made: { $ref: "events.schema.json#/$defs/Made" }
        content:
          description: The page under its title, as `MadeContent` in [the made schema](made.schema.json) describes.
          type: object
          additionalProperties: true
        state: { $ref: "events.schema.json#/$defs/MadeState" }
        changes:
          description: The 20 newest changes, newest first.
          type: array
          maxItems: 20
          items: { $ref: "events.schema.json#/$defs/MadeChange" }
    MadeStateResult:
      type: object
      required: [state]
      properties:
        state: { $ref: "events.schema.json#/$defs/MadeState" }
    MotionList:
      type: object
      required: [motions]
      properties:
        motions:
          type: array
          items: { $ref: "events.schema.json#/$defs/Motion" }
    MotionDetail:
      type: object
      required: [motion, content, state, changes]
      properties:
        motion: { $ref: "events.schema.json#/$defs/Motion" }
        content:
          description: The thing's content, as its kind describes, with every item's id.
          type: object
          additionalProperties: true
        state:
          description: Your ticks, as its kind describes. `{}` until you tick something.
          type: object
          additionalProperties: true
        changes:
          description: The 20 newest entries of "What changed", newest first.
          type: array
          items: { $ref: "events.schema.json#/$defs/MotionChange" }
    MotionState:
      type: object
      required: [state]
      properties:
        state: { type: object, additionalProperties: true }
    StopResult:
      type: object
      required: [turn, state]
      properties:
        turn: { $ref: "events.schema.json#/$defs/TurnId" }
        state:
          description: "`stopping` until the agent has stopped; `ended` if the turn had already ended."
          enum: [stopping, ended]
        outcome:
          $ref: "events.schema.json#/$defs/Outcome"
          description: How the turn ended, when `state` is `ended`.
    RetryResult:
      type: object
      required: [turn, retry_of]
      properties:
        turn:
          $ref: "events.schema.json#/$defs/TurnId"
          description: The new attempt.
        retry_of:
          $ref: "events.schema.json#/$defs/TurnId"
          description: The failed turn.
    AttachmentResult:
      type: object
      required: [attachment]
      properties:
        attachment: { $ref: "events.schema.json#/$defs/Attachment" }
    UploadKind:
      description: "`audio` for a recording, `image` for a photo, `file` for a document."
      enum: [audio, image, file]
    UploadKindLimit:
      type: object
      required: [kind, max_bytes, media_types]
      properties:
        kind: { $ref: "#/components/schemas/UploadKind" }
        max_bytes:
          description: The largest file of this kind, in bytes.
          type: integer
          minimum: 1
        media_types:
          description: The media types of this kind that big uploads take.
          type: array
          items: { type: string }
    UploadLimits:
      type: object
      required: [simple_bytes, chunk_bytes, kinds]
      properties:
        simple_bytes:
          description: The largest file `PUT /v0/attachments/{attachment}` takes in one go; anything bigger goes in chunks.
          type: integer
          minimum: 1
        chunk_bytes:
          description: The most one chunk may hold.
          type: integer
          minimum: 1
        kinds:
          type: array
          items: { $ref: "#/components/schemas/UploadKindLimit" }
    CreateUpload:
      type: object
      required: [id, name, media_type, size]
      properties:
        id: { $ref: "events.schema.json#/$defs/UploadId" }
        name:
          description: The file's name, shown with the message and used in the agent's workspace.
          type: string
          minLength: 1
          maxLength: 255
        media_type:
          description: Its media type, such as `audio/mp4` for a Voice Memos recording.
          type: string
          minLength: 1
          maxLength: 255
        size:
          description: Its whole size, in bytes.
          type: integer
          minimum: 1
    Upload:
      type: object
      required: [id, name, media_type, kind, size, received, state]
      properties:
        id: { $ref: "events.schema.json#/$defs/UploadId" }
        name: { type: string, minLength: 1, maxLength: 255 }
        media_type: { type: string, minLength: 1 }
        kind: { $ref: "#/components/schemas/UploadKind" }
        size:
          description: Its whole size, in bytes, as the app said.
          type: integer
          minimum: 1
        received:
          description: How many bytes from the start the server has on disk. The next chunk starts here.
          type: integer
          minimum: 0
        state:
          description: "`receiving` until it's finished; `finished` once it's an attachment."
          enum: [receiving, finished]
        expires_at:
          $ref: "events.schema.json#/$defs/Timestamp"
          description: "`receiving` only: when the server deletes it if no more arrives."
        attachment:
          $ref: "events.schema.json#/$defs/Attachment"
          description: "`finished` only: the attachment it became."
    Transcription:
      type: object
      required: [state, languages, consent]
      properties:
        state:
          description: |
            Whether the server can transcribe a recording now: `ready`; `loading` while its voice
            starts; `unavailable` when it has none or it failed, as `reason` says. A recording sent
            while it can't waits, queued, until it can.
          enum: [ready, loading, unavailable]
        reason:
          description: Why it isn't ready.
          type: string
        languages:
          description: The languages it transcribes well, such as `en`; speech in others comes out wrong.
          type: array
          items: { type: string }
        consent:
          description: A line to show before a recording is sent, about the other people in it.
          type: string
    UploadResult:
      type: object
      required: [upload]
      properties:
        upload: { $ref: "#/components/schemas/Upload" }
    UploadErrorResult:
      type: object
      required: [error, upload]
      properties:
        error: { $ref: "events.schema.json#/$defs/Error" }
        upload: { $ref: "#/components/schemas/Upload" }
    UploadList:
      type: object
      required: [limits, transcription, uploads]
      properties:
        limits: { $ref: "#/components/schemas/UploadLimits" }
        transcription: { $ref: "#/components/schemas/Transcription" }
        uploads:
          description: The big uploads that haven't finished, oldest first.
          type: array
          items: { $ref: "#/components/schemas/Upload" }
    RecordingList:
      type: object
      required: [recordings]
      properties:
        recordings:
          type: array
          items: { $ref: "events.schema.json#/$defs/Recording" }
    RecordingResult:
      type: object
      required: [recording]
      properties:
        recording: { $ref: "events.schema.json#/$defs/Recording" }
    RecordingErrorResult:
      type: object
      required: [error, recording]
      properties:
        error: { $ref: "events.schema.json#/$defs/Error" }
        recording: { $ref: "events.schema.json#/$defs/Recording" }
    TranscriptSpeaker:
      type: object
      required: [id, name, seconds, you]
      properties:
        id:
          description: "`S1`, `S2`… in the order they first speak, or `you` for the voice that matches your voiceprint."
          type: string
          minLength: 1
        name:
          description: What to call them, such as "Speaker 1", "You", or the name you gave them.
          type: string
          minLength: 1
        seconds:
          description: How long they spoke, roughly.
          type: number
          minimum: 0
        you:
          description: Whether this voice matched yours. Without a voiceprint (it's learnt on calls), no voice is you.
          type: boolean
    TranscriptSegment:
      type: object
      required: [start, end, text]
      properties:
        start:
          description: Seconds from the start of the recording.
          type: number
          minimum: 0
        end:
          type: number
          minimum: 0
        text:
          description: What was said, as the model heard it, with your corrections.
          type: string
        speaker:
          description: The `id` of who said it, when the server could tell.
          type: string
    TranscriptCorrection:
      type: object
      required: [heard, meant]
      properties:
        heard:
          description: The words as the model heard them, matched whole and in any case.
          type: string
          minLength: 1
          maxLength: 200
        meant:
          description: What was really said.
          type: string
          minLength: 1
          maxLength: 200
    SpeakerName:
      type: object
      required: [id, name]
      properties:
        id: { type: string, minLength: 1 }
        name: { type: string, minLength: 1, maxLength: 80 }
    Transcript:
      type: object
      required: [attachment, name, duration_seconds, language, model, speakers, segments, corrections, made_at]
      properties:
        attachment: { $ref: "events.schema.json#/$defs/AttachmentId" }
        name:
          description: The recording's file name.
          type: string
        duration_seconds: { type: number, minimum: 0 }
        language: { type: string }
        model:
          description: The speech model that heard it, such as `nvidia/parakeet-tdt-0.6b-v2`.
          type: string
        speakers:
          description: The voices the server told apart, a best guess; empty when it couldn't tell.
          type: array
          items: { $ref: "#/components/schemas/TranscriptSpeaker" }
        segments:
          type: array
          items: { $ref: "#/components/schemas/TranscriptSegment" }
        corrections:
          description: The corrections applied, in order.
          type: array
          items: { $ref: "#/components/schemas/TranscriptCorrection" }
        made_at: { $ref: "events.schema.json#/$defs/Timestamp" }
    TranscriptResult:
      type: object
      required: [transcript]
      properties:
        transcript: { $ref: "#/components/schemas/Transcript" }
    CorrectTranscript:
      type: object
      minProperties: 1
      properties:
        replace:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/TranscriptCorrection" }
        speakers:
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/SpeakerName" }
    FileVersion:
      type: object
      required: [version, attachment, made_at]
      properties:
        version:
          description: 1 for the first one Kumo showed, then one more each time it showed a change.
          type: integer
          minimum: 1
        attachment:
          $ref: "events.schema.json#/$defs/Attachment"
          description: This version's bytes, name, media type and size.
        note:
          description: What changed since the version before, in Kumo's words.
          type: string
        made_at: { $ref: "events.schema.json#/$defs/Timestamp" }
    ShownFile:
      type: object
      required: [id, name, versions]
      properties:
        id: { $ref: "events.schema.json#/$defs/FileId" }
        name:
          description: The latest version's name.
          type: string
        versions:
          description: Oldest first; the last is the latest.
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/FileVersion" }
    FileList:
      type: object
      required: [files]
      properties:
        files:
          type: array
          items: { $ref: "#/components/schemas/ShownFile" }
    FileResult:
      type: object
      required: [file]
      properties:
        file: { $ref: "#/components/schemas/ShownFile" }
    FinishUpload:
      type: object
      properties:
        sha256:
          description: The whole file's SHA-256, in lowercase hex, for the server to check.
          type: string
          pattern: ^[0-9a-f]{64}$
    Pair:
      type: object
      required: [code, device_name]
      properties:
        code:
          description: The code from the QR code, with or without its dash, in any case.
          type: string
          minLength: 8
          maxLength: 16
        device_name:
          description: What to call this device, such as "Sam's iPhone"; `ito pair` shows it when pairing succeeds.
          type: string
          minLength: 1
          maxLength: 80
    PairResult:
      type: object
      required: [token]
      properties:
        token:
          description: "This device's token. Send it as `Authorization: Bearer <token>`."
          type: string
    AskResult:
      type: object
      required: [ask]
      properties:
        ask: { $ref: "events.schema.json#/$defs/Ask" }
    RegisterDevice:
      type: object
      required: [apns_token, environment, notification_key]
      properties:
        apns_token:
          description: The device token from Apple Push Notification service, in hex.
          type: string
          pattern: ^[0-9a-f]{64,200}$
        environment:
          description: "`sandbox` for builds from Xcode, `production` for TestFlight and the App Store."
          enum: [sandbox, production]
        notification_key:
          description: A random 256-bit key the device made for its notifications, base64. The server encrypts each notification's text with it (AES-256-GCM), so Apple sees only ciphertext.
          type: string
          pattern: ^[A-Za-z0-9+/]{43}=$
    Device:
      type: object
      required: [id, environment, key_id, registered_at]
      properties:
        id:
          description: The device's id, as the app made it.
          type: string
          format: uuid
        environment:
          enum: [sandbox, production]
        key_id:
          description: Names the current key in each notification's `ito.k`, as the first 8 hex characters of the key's SHA-256.
          type: string
          pattern: ^[0-9a-f]{8}$
        registered_at: { $ref: "events.schema.json#/$defs/Timestamp" }
    DeviceResult:
      type: object
      required: [device]
      properties:
        device: { $ref: "#/components/schemas/Device" }
    Whereabouts:
      type: object
      required: [time_zone]
      additionalProperties: false
      properties:
        time_zone:
          description: The phone's time zone, as an IANA name such as `Europe/Rome`.
          type: string
          minLength: 1
          maxLength: 64
        area:
          $ref: "#/components/schemas/Area"
          description: Roughly where it is, when you allow it. The box rounds it to about 10 km.
    Area:
      description: Roughly where you are, never more precise than about 10 km.
      type: object
      required: [latitude, longitude]
      additionalProperties: false
      properties:
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
        name:
          description: The town or city, such as `Rome`, as the phone names it.
          type: string
          minLength: 1
          maxLength: 80
    ErrorResult:
      type: object
      required: [error]
      properties:
        error: { $ref: "events.schema.json#/$defs/Error" }
